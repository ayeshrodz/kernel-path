tagline: Learn core Linux administration by doing
summary: 'Build practical Linux administration skills on RHEL 9: shell and files,
  identity and access, services and logs, networking, software, storage, security
  and rootless containers. Explain each change, verify its useful result, and rehearse
  recovery on a resettable practice lab. Prepares you for the RHCSA (EX200) exam.'
