name: sa-first-scripts
title: Write and run your first scripts
page: ch15/exercise-first-scripts
transport: ssh
version: 1
starter: []
setup:
- action: directory
  hosts:
  - servera
  path: /home/student/scripts
  state: absent
- action: file
  hosts:
  - servera
  path: /home/student/bin/hello.sh
  state: absent
checkpoints:
  final:
    files: []
    checks:
    - id: hello
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: hello.sh is an executable script with a default name
      paths:
      - /home/student/scripts/hello.sh
      executable: true
      owner: student
      contains:
      - name=${1:-$USER}
    - id: args
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: args.sh loops over "$@"
      paths:
      - /home/student/scripts/args.sh
      executable: true
      contains:
      - for a in "$@"
    - id: path
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: a copy of hello.sh is in ~/bin (on the PATH)
      paths:
      - /home/student/bin/hello.sh
      executable: true
finish:
- action: directory
  hosts:
  - servera
  path: /home/student/scripts
  state: absent
- action: file
  hosts:
  - servera
  path: /home/student/bin/hello.sh
  state: absent
