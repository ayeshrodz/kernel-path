- action: group
  hosts:
  - servera
  name: portal
  state: present
  gid: 4800
- action: user
  hosts:
  - servera
  name: portaladm
  state: present
  uid: 3001
  group: portal
  shell: /sbin/nologin
- action: package
  hosts:
  - servera
  names:
  - httpd
  state: present
- action: selinux
  hosts:
  - servera
  kind: port
  state: present
  type: http_port_t
  proto: tcp
  port: 8090
- action: selinux
  hosts:
  - servera
  kind: fcontext
  state: present
  type: httpd_sys_content_t
  path: /srv/portal(/.*)?
- action: directory
  hosts:
  - servera
  path: /srv/portal
  state: present
  owner: portaladm
  group: portal
  mode: '2750'
- action: file
  hosts:
  - servera
  path: /srv/portal/index.html
  state: present
  content: 'Portal status: OK

    '
  owner: portaladm
  group: portal
  mode: '640'
- action: acl
  hosts:
  - servera
  path: /srv/portal
  entries:
  - u:apache:rX
  - d:u:apache:rX
- action: acl
  hosts:
  - servera
  path: /srv/portal/index.html
  entries:
  - u:apache:r
- action: file
  hosts:
  - servera
  path: /etc/httpd/conf.d/portal.conf
  state: present
  content: "Listen 8090\n<VirtualHost *:8090>\n    DocumentRoot /srv/portal\n    <Directory /srv/portal>\n        Require all granted\n    </Directory>\n</VirtualHost>\n"
- action: service
  hosts:
  - servera
  names:
  - httpd
  state: started
  enabled: true
- action: firewall
  hosts:
  - servera
  state: present
  zone: portal
  deleteZone: true
- action: firewall
  hosts:
  - servera
  state: present
  zone: portal
  source: '@serverb'
- action: firewall
  hosts:
  - servera
  state: present
  zone: portal
  port: 8090/tcp
checkpoints:
  final:
    files: []
    checks:
    - id: svc
      kind: service
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: httpd is running
      names:
      - httpd.service
      active: true
    - id: label
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the page carries the web content type again
      paths:
      - /srv/portal/index.html
      selinuxType: httpd_sys_content_t
    - id: acl
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the ACL for apache is back
      paths:
      - /srv/portal/index.html
      acl:
      - user:apache:r--
    - id: port
      kind: selinux-port
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: TCP port 8090 is labelled http_port_t again
      type: http_port_t
      proto: tcp
      port: 8090
    - id: zone
      kind: firewall
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the zone portal allows 8090/tcp again
      zone: portal
      port: 8090/tcp
    - id: content
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the page says DOWN (fault 6, repaired in the next exercise)
      paths:
      - /srv/portal/index.html
      line: 'Portal status: DOWN'
