name: sa-passwords
title: Onboard and offboard an intern
page: ch06/exercise-passwords
transport: ssh
version: 1
starter: []
setup:
- action: user
  hosts:
  - servera
  name: intern
  state: absent
checkpoints:
  final:
    files: []
    checks:
    - id: intern
      kind: user
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: intern exists with the aging policy 90/1/7
      names:
      - intern
      maxDays: 90
      minDays: 1
      warnDays: 7
    - id: expired
      kind: user
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the account is expired
      names:
      - intern
      expires: '1970-01-01'
finish:
- action: user
  hosts:
  - servera
  name: intern
  state: absent
