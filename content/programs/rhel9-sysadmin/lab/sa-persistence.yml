name: sa-persistence
title: Keep and rotate your logs
page: ch11/exercise-persistence
transport: ssh
version: 1
starter: []
setup:
- action: file
  hosts:
  - servera
  path: /etc/rsyslog.d/10-myapp.conf
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/logrotate.d/myapp
  state: absent
- action: file
  hosts:
  - servera
  path: /var/log/myapp.log
  state: absent
- action: file
  hosts:
  - servera
  path: /var/log/myapp.log.1.gz
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/systemd/journald.conf.d/10-retention.conf
  state: absent
- action: service
  hosts:
  - servera
  names:
  - rsyslog
  state: restarted
checkpoints:
  final:
    files: []
    checks:
    - id: journal-dir
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the journal directory exists
      paths:
      - /var/log/journal
      fileType: directory
    - id: journal-conf
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: journald is persistent and limited to 200M
      paths:
      - /etc/systemd/journald.conf.d/10-retention.conf
      contains:
      - Storage=persistent
      - SystemMaxUse=200M
    - id: rsyslog
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: rsyslog sends facility local5 to /var/log/myapp.log
      paths:
      - /etc/rsyslog.d/10-myapp.conf
      matches: ^local5\.\*[[:space:]]+/var/log/myapp\.log[[:space:]]*$
    - id: rotate
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: logrotate rotates weekly, keeps 4, compresses
      paths:
      - /etc/logrotate.d/myapp
      contains:
      - weekly
      - rotate 4
      - compress
      - missingok
      - notifempty
      - create 0640 root root
    - id: rotated
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the first rotation produced myapp.log.1.gz
      paths:
      - /var/log/myapp.log.1.gz
      fileType: regular
finish:
- action: file
  hosts:
  - servera
  path: /etc/rsyslog.d/10-myapp.conf
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/logrotate.d/myapp
  state: absent
- action: file
  hosts:
  - servera
  path: /var/log/myapp.log
  state: absent
- action: file
  hosts:
  - servera
  path: /var/log/myapp.log.1.gz
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/systemd/journald.conf.d/10-retention.conf
  state: absent
- action: service
  hosts:
  - servera
  names:
  - rsyslog
  state: restarted
- action: directory
  hosts:
  - servera
  path: /var/log/journal
  state: absent
- action: service
  hosts:
  - servera
  names:
  - systemd-journald
  state: restarted
