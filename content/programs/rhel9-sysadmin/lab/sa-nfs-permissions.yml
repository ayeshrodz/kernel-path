name: sa-nfs-permissions
title: Get the permissions right
page: ch19/exercise-permissions
transport: ssh
version: 1
starter: []
setup:
- action: unmount
  hosts:
  - servera
  path: /mnt/shared
- action: remove-lines
  hosts:
  - servera
  path: /etc/fstab
  matching: serverb:/srv/shared
- action: directory
  hosts:
  - servera
  path: /mnt/shared
  state: absent
- action: directory
  hosts:
  - servera
  path: /mnt/auto
  state: absent
- action: directory
  hosts:
  - servera
  path: /remote
  state: absent
- action: directory
