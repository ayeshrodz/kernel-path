  state: absent
- action: file
  hosts:
  - servera
  path: /etc/auto.master.d/homes.autofs
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/auto.master.d/direct.autofs
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/auto.shared
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/auto.homes
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/auto.direct
  state: absent
- action: file
  hosts:
  - servera
  path: /root/fstab.bak
  state: absent
- action: service
  hosts:
  - servera
  names:
  - autofs
  state: stopped
  enabled: false
- action: package
  hosts:
  - servera
  names:
  - autofs
  state: absent
- action: user
  hosts:
  - servera
  name: alice
  state: absent
- action: group
  hosts:
  - servera
  name: team
  state: absent
- action: systemd
  hosts:
  - servera
  reload: true
- action: remove-lines
  hosts:
  - serverb
  path: /etc/exports
  matching: /srv/
- action: service
  hosts:
  - serverb
  names:
  - nfs-server
  state: stopped
  enabled: false
- action: firewall
  hosts:
  - serverb
  state: absent
  service: nfs
- action: directory
  hosts:
  - serverb
  path: /srv/shared
  state: absent
- action: directory
  hosts:
  - serverb
  path: /srv/homes
  state: absent
- action: user
  hosts:
  - serverb
  name: alice
  state: absent
- action: group
  hosts:
  - serverb
  name: team
  state: absent
- action: package
  hosts:
  - serverb
  names:
  - nfs-utils
  state: present
- action: directory
  hosts:
  - serverb
  path: /srv/shared
  state: present
- action: file
  hosts:
  - serverb
  path: /srv/shared/hello.txt
  state: present
  content: 'shared file

    '
- action: append-line
  hosts:
  - serverb
  path: /etc/exports
  line: /srv/shared  172.25.0.0/16(rw,sync)
- action: service
  hosts:
  - serverb
  names:
  - nfs-server
  state: restarted
  enabled: true
- action: firewall
  hosts:
  - serverb
  state: present
  service: nfs
- action: package
  hosts:
  - servera
  names:
  - nfs-utils
  state: present
- action: directory
  hosts:
  - servera
  path: /mnt/shared
  state: present
checkpoints:
  final:
    files: []
    checks:
    - id: student
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: student wrote st.txt over NFS (UID 1000 on both sides)
      paths:
      - /srv/shared/st.txt
      owner: student
      line: from servera as student
    - id: alice
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: alice wrote from servera, stored with her UID
      paths:
      - /srv/shared/alice/from-servera.txt
      owner: alice
      line: written from servera
    - id: alice-a
      kind: user
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: alice has UID 2001 on the client
      names:
      - alice
      uid: 2001
    - id: alice-b
      kind: user
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: alice has UID 2001 on the server
      names:
      - alice
      uid: 2001
    - id: team
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: /srv/shared/team is group team with setgid
      paths:
      - /srv/shared/team
      fileType: directory
      group: team
      mode: '2775'
    - id: by-alice
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: alice created a file in the team directory
      paths:
      - /srv/shared/team/by-alice.txt
      owner: alice
      group: team
    - id: by-student
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: student created a file in the team directory
      paths:
      - /srv/shared/team/by-student.txt
      owner: student
      group: team
