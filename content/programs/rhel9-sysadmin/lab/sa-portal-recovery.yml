name: sa-portal-recovery
title: Restore and hand over
page: ch22/exercise-recovery
transport: ssh
version: 1
starter: []
setup:
- action: service
  hosts:
  - servera
  names:
  - portal-backup.timer
  state: stopped
  enabled: false
- action: service
  hosts:
  - servera
  names:
  - httpd
  state: stopped
  enabled: false
- action: firewall
  hosts:
  - servera
  state: absent
  zone: portal
  deleteZone: true
- action: selinux
  hosts:
  - servera
  kind: port
  state: absent
  type: http_port_t
  proto: tcp
  port: 8090
- action: selinux
  hosts:
  - servera
  kind: fcontext
  state: absent
  path: /srv/portal(/.*)?
- action: directory
  hosts:
  - servera
  path: /srv/portal
  state: absent
- action: directory
  hosts:
  - servera
  path: /srv/backups
  state: absent
- action: directory
  hosts:
  - servera
  path: /root/stage
  state: absent
- action: directory
  hosts:
  - servera
  path: /root/bad
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/httpd/conf.d/portal.conf
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/systemd/system/portal-backup.service
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/systemd/system/portal-backup.timer
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/systemd/journald.conf.d/10-persistent.conf
  state: absent
- action: file
  hosts:
  - servera
  path: /root/portal-handover.txt
  state: absent
- action: systemd
  hosts:
  - servera
  reload: true
- action: user
  hosts:
  - servera
  name: portaladm
  state: absent
- action: group
  hosts:
  - servera
  name: portal
  state: absent
- action: package
  hosts:
  - servera
  names:
  - httpd
  state: absent
- action: directory
  hosts:
  - servera
  path: /var/log/journal
  state: absent
- action: service
  hosts:
  - servera
  names:
  - systemd-journald
  state: restarted
- action: group
  hosts:
  - servera
  name: portal
  state: present
  gid: 4800
- action: user
  hosts:
  - servera
  name: portaladm
  state: present
  uid: 3001
  group: portal
  shell: /sbin/nologin
- action: package
  hosts:
  - servera
  names:
  - httpd
  state: present
- action: selinux
  hosts:
  - servera
  kind: port
  state: present
  type: http_port_t
  proto: tcp
  port: 8090
- action: selinux
  hosts:
  - servera
  kind: fcontext
  state: present
  type: httpd_sys_content_t
  path: /srv/portal(/.*)?
- action: directory
  hosts:
  - servera
  path: /srv/portal
  state: present
  owner: portaladm
  group: portal
  mode: '2750'
- action: file
  hosts:
  - servera
  path: /srv/portal/index.html
  state: present
  content: 'Portal status: OK

    '
  owner: portaladm
  group: portal
  mode: '640'
- action: acl
  hosts:
  - servera
  path: /srv/portal
  entries:
  - u:apache:rX
  - d:u:apache:rX
- action: acl
  hosts:
  - servera
  path: /srv/portal/index.html
  entries:
  - u:apache:r
- action: file
  hosts:
  - servera
  path: /etc/httpd/conf.d/portal.conf
  state: present
  content: "Listen 8090\n<VirtualHost *:8090>\n    DocumentRoot /srv/portal\n    <Directory /srv/portal>\n        Require all granted\n    </Directory>\n</VirtualHost>\n"
- action: service
  hosts:
  - servera
  names:
  - httpd
  state: started
  enabled: true
- action: firewall
  hosts:
  - servera
  state: present
  zone: portal
  deleteZone: true
- action: firewall
  hosts:
  - servera
  state: present
  zone: portal
  source: '@serverb'
- action: firewall
  hosts:
  - servera
  state: present
  zone: portal
  port: 8090/tcp
- action: directory
  hosts:
  - servera
  path: /srv/backups
  state: present
  mode: '750'
- action: file
  hosts:
  - servera
  path: /etc/systemd/system/portal-backup.service
  state: present
  content: '[Unit]

    Description=Back up the portal content


    [Service]

    Type=oneshot

    ExecStart=/usr/bin/tar --acls --selinux -czf /srv/backups/portal.tar.gz -C /srv portal

    '
- action: file
  hosts:
  - servera
  path: /etc/systemd/system/portal-backup.timer
  state: present
  content: '[Unit]

    Description=Daily portal backup


    [Timer]

    OnCalendar=daily

    Persistent=true


    [Install]

    WantedBy=timers.target

    '
- action: systemd
  hosts:
  - servera
  reload: true
- action: service
  hosts:
  - servera
  names:
  - portal-backup.timer
  state: started
  enabled: true
- action: service
  hosts:
  - servera
  names:
  - portal-backup.service
  state: started
checkpoints:
  final:
    files: []
    checks:
    - id: page
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the live page holds the restored content
      paths:
      - /srv/portal/index.html
      line: 'Portal status: OK'
      owner: portaladm
      acl:
      - user:apache:r--
      selinuxType: httpd_sys_content_t
    - id: stage
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the staging copy keeps its ACL
      paths:
      - /root/stage/portal/index.html
      acl:
      - user:apache:r--
    - id: handover
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the handover note has its sections
      paths:
      - /root/portal-handover.txt
      contains:
      - Purpose
      - Changes
      - Operate
      - Recover
      - Known failures
      - Limits
    - id: remote
      kind: http
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: serverb gets the restored page
      url: http://servera.lab.example.com:8090/
      containsAny:
      - 'Portal status: OK'
finish:
- action: service
  hosts:
  - servera
  names:
  - portal-backup.timer
  state: stopped
  enabled: false
