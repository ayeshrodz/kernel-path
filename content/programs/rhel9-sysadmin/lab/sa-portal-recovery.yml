  - servera
  path: /srv/backups
  state: absent
- action: directory
  hosts:
  - servera
  path: /root/stage
  state: absent
- action: directory
  hosts:
  - servera
  path: /root/bad
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/httpd/conf.d/portal.conf
  state: absent
- action: file
  hosts:
  - servera
  path: /etc/systemd/system/portal-backup.service
  state: absent
- action: file
