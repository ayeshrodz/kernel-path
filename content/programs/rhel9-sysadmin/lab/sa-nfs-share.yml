  - nfs-utils
  state: present
- action: directory
  hosts:
  - serverb
  path: /srv/shared
  state: present
- action: file
  hosts:
  - serverb
  path: /srv/shared/hello.txt
  state: present
  content: 'shared file

    '
- action: package
  hosts:
  - servera
  names:
  - nfs-utils
  state: present
checkpoints:
  final:
    files: []
    checks:
    - id: exports
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: /etc/exports shares /srv/shared read-write with the lab network
      paths:
      - /etc/exports
      matches: ^/srv/shared[[:space:]]+[^[:space:]]+\(rw,sync\)[[:space:]]*$
    - id: server
      kind: service
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: nfs-server is running and enabled
      names:
      - nfs-server.service
      active: true
      enabled: true
    - id: firewall
      kind: firewall
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: the nfs firewall service is open permanently
      service: nfs
    - id: mountpoint
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: /mnt/shared exists on the client
      paths:
      - /mnt/shared
      fileType: directory
    - id: no-rootfile
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: root could not create a file (root squash)
      paths:
      - /srv/shared/rootfile
      exists: false
