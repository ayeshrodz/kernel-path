  names:
  - nfs-utils
  state: present
- action: directory
  hosts:
  - serverb
  path: /srv/shared
  state: present
- action: file
  hosts:
  - serverb
  path: /srv/shared/hello.txt
  state: present
  content: 'shared file

    '
- action: append-line
  hosts:
  - serverb
  path: /etc/exports
  line: /srv/shared  172.25.0.0/16(rw,sync)
- action: service
  hosts:
  - serverb
  names:
  - nfs-server
  state: restarted
  enabled: true
- action: firewall
  hosts:
  - serverb
  state: present
  service: nfs
- action: package
  hosts:
  - servera
  names:
  - nfs-utils
  state: present
- action: directory
  hosts:
  - servera
  path: /mnt/shared
  state: present
- action: package
  hosts:
  - servera
  names:
  - autofs
  state: present
- action: service
  hosts:
  - servera
  names:
  - autofs
  state: started
  enabled: true
checkpoints:
  final:
    files: []
    checks:
    - id: homes-master
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: a master map serves /remote/homes
      paths:
      - /etc/auto.master.d/homes.autofs
      matches: ^/remote/homes[[:space:]]+/etc/auto\.homes
    - id: wildcard
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the map is a wildcard map
      paths:
      - /etc/auto.homes
      matches: ^\*[[:space:]]+-rw,sync[[:space:]]+serverb:/srv/homes/&
    - id: direct
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: a direct map mounts /mnt/direct/data
      paths:
      - /etc/auto.direct
      matches: ^/mnt/direct/data[[:space:]]+-rw[[:space:]]+serverb:/srv/shared
    - id: exports
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: serverb also exports /srv/homes
      paths:
      - /etc/exports
      contains:
      - /srv/homes
    - id: edited
      kind: file
      'on': serverb.lab.example.com
      targets:
      - serverb.lab.example.com
      message: alice edited her home from servera
      paths:
      - /srv/homes/alice/readme
      owner: alice
      line: edited from servera
    - id: autofs
      kind: service
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: autofs is running
      names:
      - autofs.service
      active: true
