name: sa-lvm-resize
title: Grow and shrink volumes
page: ch18/exercise-resize
transport: ssh
version: 1
starter: []
setup:
- action: wipe-disk
  hosts:
  - servera
  device: /dev/sdb
- action: remove-lines
  hosts:
  - servera
  path: /etc/fstab
  matching: /dev/vgdata/
- action: directory
  hosts:
  - servera
  path: /srv/app
  state: absent
- action: directory
  hosts:
  - servera
  path: /srv/log
  state: absent
- action: directory
  hosts:
  - servera
  path: /srv/data
  state: absent
- action: file
  hosts:
  - servera
  path: /root/fstab.bak
  state: absent
- action: systemd
  hosts:
  - servera
  reload: true
- action: partition-disk
  hosts:
  - servera
  device: /dev/sdb
  partitions:
  - name: pv1
    fs: lvm
    startMiB: 1
    endMiB: 1537
  - name: pv2
    fs: lvm
    startMiB: 1537
    endMiB: 3073
- action: lvm-build
  hosts:
  - servera
  vg: vgdata
  pvs:
  - /dev/sdb1
  volumes:
  - name: lvapp
    size: 1G
    fs: xfs
    mount: /srv/app
  - name: lvlog
    size: 50%FREE
    fs: ext4
    mount: /srv/log
    label: lvlog
checkpoints:
  final:
    files: []
    checks:
    - id: vg
      kind: volume-group
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: vgdata spans two physical volumes
      vg: vgdata
      minPhysicalVolumes: 2
    - id: lvapp
      kind: logical-volume
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: lvapp took all the free space (over 2 GiB)
      vg: vgdata
      lv: lvapp
      minSizeMiB: 1900
    - id: lvlog
      kind: logical-volume
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: lvlog exists
      vg: vgdata
      lv: lvlog
      minSizeMiB: 190
    - id: numbers
      kind: file
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: the data in /srv/app survived the growing
      paths:
      - /srv/app/numbers.txt
      line: '100000'
    - id: log
      kind: mount
      'on': servera.lab.example.com
      targets:
      - servera.lab.example.com
      message: /srv/log is mounted again
      path: /srv/log
      fstype: ext4
      persistent: false
finish:
- action: wipe-disk
  hosts:
  - servera
  device: /dev/sdb
- action: remove-lines
  hosts:
  - servera
  path: /etc/fstab
  matching: /dev/vgdata/
- action: directory
  hosts:
  - servera
  path: /srv/app
  state: absent
- action: directory
  hosts:
  - servera
  path: /srv/log
  state: absent
- action: directory
  hosts:
  - servera
  path: /srv/data
  state: absent
- action: file
  hosts:
  - servera
  path: /root/fstab.bak
  state: absent
- action: systemd
  hosts:
  - servera
  reload: true
