title: Storage and file systems
seoTitle: "Linux Disks, Partitions, mkfs and fstab (RHCSA)"
seoDescription: "Partition disks with parted, create XFS and ext4 file systems, mount them, make mounts and swap permanent in /etc/fstab, and free space."
goal: Partition disks, create and mount XFS, ext4 and swap, make them permanent with fstab, and find and fix space and busy-mount problems.
objectives:
  - Identify disks and partitions and create a GPT table and partitions with parted.
  - Create XFS, ext4 and swap, and mount and unmount file systems.
  - Write safe /etc/fstab entries by UUID with options, and test them before rebooting.
  - Diagnose full file systems, inode exhaustion, deleted-but-open files and busy mounts, and use the repair and label tools.
objectiveIds:
  - ch17.partitions
  - ch17.filesystems
  - ch17.fstab
  - ch17.maintenance
