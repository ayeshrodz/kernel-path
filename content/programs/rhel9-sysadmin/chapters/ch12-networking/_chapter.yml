title: Networking
seoTitle: "nmcli and NetworkManager: Linux Networking (RHCSA)"
seoDescription: "Configure static IP addresses with nmcli, set host names and DNS, and troubleshoot Linux network problems step by step. RHCSA chapter 12."
goal: Read and configure a host's network with ip and NetworkManager, manage names and DNS, and troubleshoot connections layer by layer.
objectives:
  - Explain address, prefix, gateway and DNS, and inspect them with ip, ping and ss.
  - Create and modify persistent connection profiles with nmcli.
  - Set the host name and explain name resolution through /etc/hosts and DNS.
  - Troubleshoot a connection layer by layer and read the failure messages.
objectiveIds:
  - ch12.basics
  - ch12.networkmanager
  - ch12.names
  - ch12.troubleshooting
