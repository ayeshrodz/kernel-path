title: SELinux
seoTitle: "SELinux Tutorial: Contexts, Booleans, Ports (RHCSA)"
seoDescription: "Understand SELinux on RHEL 9: modes, file contexts, restorecon, semanage fcontext, booleans, port labels and fixing denials."
goal: Understand SELinux contexts and modes, fix file labels, booleans and ports the right way, and troubleshoot denials without disabling the protection.
objectives:
  - Explain mandatory access control, read security contexts, and show and switch the SELinux mode.
  - Set permanent file-context rules with semanage fcontext and apply them with restorecon.
  - Change booleans and port labels permanently, and choose between a label, a boolean and a port.
  - Diagnose denials from the audit log and fix them with the smallest change, testing in enforcing mode.
objectiveIds:
  - ch16.concepts
  - ch16.contexts
  - ch16.booleans
  - ch16.troubleshooting
