order:
  title: Which permissions apply?
  caption: Step through john reading a file owned by maria:project, mode 640.
  height: 230
  mode: steps
  steps:
  - title: The file
    text: report.txt is owned by user maria and group project, with mode rw-r-----. john is a member of project.
  - title: Is john the owner?
    text: No, maria is. The owner bits (rw-) are skipped. If john were the owner they would be used, even if the group bits allowed more.
  - title: Is john in the group?
    text: Yes. The group bits (r--) now decide, and the check stops here. The "other" bits are never looked at.
  - title: The result
    text: r-- includes read, so cat works. Writing is refused because w is missing.
  - title: A different user
    text: If a user who is neither maria nor in project tried, the "other" bits (---) would apply, and everything is refused.
  elements:
  - kind: node
    x: 190
    y: 10
    w: 300
    h: 40
    tone: blue
    title: 'john runs: cat report.txt'
    mono: true
    titleSize: 12.5
    active:
    - 0
  - kind: node
    x: 20
    y: 80
    w: 190
    h: 60
    tone: purple
    title: 1. owner?
    sub: 'maria: rw-'
    active:
    - 1
    - 4
    visible:
    - 1
    - 2
    - 3
    - 4
  - kind: node
    x: 245
    y: 80
    w: 190
    h: 60
    tone: teal
    title: 2. group?
    sub: 'project: r--'
    active:
    - 2
    - 3
    visible:
    - 2
    - 3
    - 4
  - kind: node
    x: 470
    y: 80
    w: 190
    h: 60
    tone: amber
    title: 3. everyone else
    sub: 'other: ---'
    active:
    - 4
    visible:
    - 4
  - kind: arrow
    points:
    - - 210
      - 110
    - - 245
      - 110
    label: 'no'
    labelDy: -6
    visible:
    - 2
    - 3
    - 4
  - kind: arrow
    points:
    - - 435
      - 110
    - - 470
      - 110
