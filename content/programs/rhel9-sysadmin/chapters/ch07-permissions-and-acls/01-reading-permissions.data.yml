practice:
  text:
    hint: Click here and type the commands. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: reading permissions'
    prompt: '[student@servera ~]$'
    commands:
    - cmd: ls -l report.txt
      out: -rw-r-----. 1 maria project 1024 Oct  3 10:15 report.txt
    - cmd: ls -ld /srv/project
      out: drwxrws---. 2 root project 4096 Oct  3 10:15 /srv/project
    - cmd: ls -ld /tmp
      out: drwxrwxrwt. 11 root root 4096 Oct  3 10:20 /tmp
    - cmd: stat -c "%A %a %U:%G %n" report.txt
      out: -rw-r----- 640 maria:project report.txt
    - cmd: id
      out: uid=1000(student) gid=1000(student) groups=1000(student),10(wheel)
    - cmd: id john
      out: uid=1002(john) gid=1002(john) groups=1002(john),4500(project)
    - cmd: cat report.txt
      out: 'cat: report.txt: Permission denied'
    - cmd: namei -l /srv/project/plan.txt
      out: "f: /srv/project/plan.txt\ndrwxr-xr-x root root /\ndrwxr-xr-x root root srv\ndrwxrws--- root project project\n                     plan.txt - No such file or directory"
    tasks:
    - text: List report.txt in long format.
      commands:
      - ls -l report.txt
    - text: Show only its permissions in octal, with owner and group.
      commands:
      - stat -c "%A %a %U:%G %n" report.txt
    - text: List the directory /srv/project itself, not its contents.
      commands:
      - ls -ld /srv/project
    - text: Find out which groups you belong to.
      commands:
      - id
    - text: Check each directory on the way to /srv/project/plan.txt.
      commands:
      - namei -l /srv/project/plan.txt
quick:
  questions:
  - id: q-6b074d0f417e
    q: What does the first character of -rw-r-----. tell you?
    options:
    - It is a regular file
    - It is a directory
    - It is owned by root
    answer: 0
    explain: A dash means a regular file. d would be a directory and l a symbolic link.
  - id: q-f0619edd6556
    q: A file is owned by maria:project with mode 640. john is in project. What can john do?
    options:
    - Read it
    - Read and write it
    - Nothing
    answer: 0
    explain: 'John falls into the group class: r-- allows reading only.'
  - id: q-7819e26c9c0d
    q: maria owns a file with mode 070 (---rwx---). Can maria read it?
    options:
    - Yes, she is the owner
    - No, the owner bits are ---
    - Yes, because she is also in the group
    answer: 1
    explain: 'Only one class applies: the first match wins. As owner, maria gets ---, even if she is also in the group. (She could change the mode, though.)'
  - id: q-12b2e734e7dc
    q: On a directory, what does the x permission mean?
    options:
    - You can run the directory
    - You can enter it and reach the files in it
    - You can list its names
    answer: 1
    explain: 'x on a directory is "search": entering it and opening entries by name. Listing the names needs r.'
  - id: q-5ff3e1013d18
    q: Which tool shows the permissions of every directory along a path?
    options:
    - namei -l
    - ls -R
    - stat
    answer: 0
    explain: namei -l prints each component with its mode and owner, which makes a blocked directory easy to spot.
  - id: q-9565491514df
    q: A file is mode 644 inside a directory with mode 700 owned by root. Can student read the file?
    options:
    - Yes, the file is world-readable
    - No, student cannot enter the directory
    - Only with sudo -i
    answer: 1
    explain: Permissions on the file only matter if you can reach it. Without x on the directory, the path is blocked.
