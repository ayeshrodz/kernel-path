perm-line:
  title: One line of ls -l
  caption: Select a part of the listing to see what it means.
  height: 170
  mode: select
  initial: user
  info:
    type:
      tone: gray
      title: File type
      text: 'The first character: - is a regular file, d a directory, l a symbolic link.'
    user:
      tone: purple
      title: Owner permissions
      text: 'Three characters for the user who owns the file: r read, w write, x execute, or - for not allowed.'
    group:
      tone: teal
      title: Group permissions
      text: The same three for members of the group that owns the file (not counting the owner).
    other:
      tone: amber
      title: Other permissions
      text: The same three for everybody else on the system.
    dot:
      tone: gray
      title: SELinux marker
      text: A dot means the file has an SELinux label (chapter 16). A + here would mean it also has an ACL (this chapter).
    links:
      tone: blue
      title: Link count
      text: How many names the file has. For a directory it counts the entries that point at it.
    owner:
      tone: purple
      title: Owner
      text: The user who owns the file. Usually the person who created it.
    grp:
      tone: teal
      title: Group owner
      text: The one group the file belongs to. Usually the creator's primary group, unless the directory says otherwise.
