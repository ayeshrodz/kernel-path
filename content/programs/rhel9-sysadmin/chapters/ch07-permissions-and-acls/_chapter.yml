title: Permissions and ACLs
seoTitle: "Linux File Permissions, chmod and ACLs (RHCSA)"
seoDescription: "Read and change Linux permissions with chmod and chown, use umask, setgid and sticky bits, and grant access with ACLs (setfacl)."
goal: Read and change file permissions and ownership, build shared team directories with setgid and sticky bits, and grant exceptions with access control lists.
objectives:
  - Read the permission string of ls -l and predict which user class applies and what it allows on files and directories.
  - Change modes with chmod in symbols and octal, change owner and group, and apply changes safely to a tree.
  - Explain the umask and the setuid, setgid and sticky bits, and build shared and drop-box directories.
  - Read getfacl, grant and remove ACL entries with setfacl, and set default ACLs for new files.
objectiveIds:
  - ch07.reading
  - ch07.changing
  - ch07.defaults
  - ch07.acls
