acl-lines:
  title: A complete ACL
  caption: Select an entry of getfacl output.
  height: 230
  mode: select
  initial: named
  info:
    user:
      tone: purple
      title: user::rw-
      text: The owner entry. The same as the owner bits in ls -l.
    named:
      tone: blue
      title: user:john:rw-
      text: 'A named user. This is the extra access an ACL exists for: john, who is neither the owner nor in the group, can read and write.'
    group:
      tone: teal
      title: group::r--
      text: The owning group entry. With an ACL, the group bits in ls -l show the mask instead of this entry.
    mask:
      tone: amber
      title: mask::r--
      text: 'The ceiling for named users, named groups and the owning group. Here it is r--, so john''s rw- is cut to r-- (getfacl shows #effective:r--). It does not limit the owner or other.'
    other:
      tone: gray
      title: other::---
      text: Everyone else.
  elements:
  - kind: node
    x: 10
    y: 20
    w: 128
    h: 56
    tone: purple
    title: user::rw-
    mono: true
    titleSize: 12.5
    select: user
    active:
    - user
  - kind: node
    x: 142
    y: 20
    w: 134
    h: 56
    tone: blue
    title: user:john:rw-
    mono: true
    titleSize: 12.5
    select: named
    active:
    - named
  - kind: node
    x: 280
    y: 20
    w: 128
    h: 56
    tone: teal
    title: group::r--
    mono: true
    titleSize: 12.5
    select: group
    active:
    - group
  - kind: node
    x: 412
    y: 20
    w: 128
    h: 56
    tone: amber
    title: mask::r--
    mono: true
    titleSize: 12.5
