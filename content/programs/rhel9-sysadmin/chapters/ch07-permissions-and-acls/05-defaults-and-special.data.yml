special:
  title: The three special permissions
  caption: Select one to see what it does and where it is used.
  height: 230
  mode: select
  initial: setgid
  info:
    setuid:
      tone: coral
      title: setuid (4)
      text: 'On an executable: it runs with the owner''s identity, not the caller''s. /usr/bin/passwd is owned by root and setuid, so ordinary users can change their password. Shown as s in the owner x position.'
    setgid:
      tone: teal
      title: setgid (2)
      text: 'On a directory: new files and directories get the directory''s group instead of the creator''s primary group. The key to shared project directories. Shown as s in the group x position.'
    sticky:
      tone: amber
      title: sticky bit (1)
      text: 'On a directory: users may delete or rename only their own entries, even if they can write to the directory. /tmp uses it. Shown as t in the other x position.'
  elements:
  - kind: node
    x: 20
    y: 20
    w: 200
    h: 70
    tone: coral
    title: setuid  4000
    sub: chmod u+s  ·  -rwsr-xr-x
    mono: true
    titleSize: 12.5
    select: setuid
    active:
    - setuid
  - kind: node
    x: 240
    y: 20
    w: 200
    h: 70
    tone: teal
    title: setgid  2000
    sub: chmod g+s  ·  drwxrws---
