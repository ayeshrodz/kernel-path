umask:
  title: How umask shapes new files
  caption: Step through creating a file and a directory with umask 027.
  height: 230
  mode: steps
  steps:
  - title: Programs ask for a maximum
    text: 'A program creating a file asks for 666 (rw-rw-rw-): files never start with execute. A directory starts at 777.'
  - title: The umask removes bits
    text: 'umask 027 means: remove nothing from the owner, write from the group (2), everything from others (7).'
  - title: 'The result: files'
    text: 666 with 027 removed leaves 640 (rw-r-----). The group keeps read; others get nothing.
  - title: 'The result: directories'
    text: 777 with 027 removed leaves 750 (rwxr-x---). Directories keep x so the group can enter them.
  - title: Only for new things
    text: Changing the umask does nothing to files that exist. Use chmod for those. The usual RHEL default for users is 022; root gets 022 too.
