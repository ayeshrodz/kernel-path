quick:
  questions:
  - id: q-538e2592d6a3
    q: With umask 022, what mode does a new text file get?
    options:
    - '644'
    - '755'
    - '666'
    answer: 0
    explain: 666 minus 022 leaves 644 (rw-r--r--). Files do not get execute bits from the umask.
  - id: q-c778b54d88dd
    q: Which umask gives new files 600 and new directories 700?
    options:
    - '077'
    - '027'
    - '007'
    answer: 0
    explain: 077 removes everything from group and others.
  - id: q-7e071c4518cc
    q: A directory is mode 2770 owned by root:project. maria (primary group maria, also in project) creates a file in it. Which group owns the file?
    options:
    - project
    - maria
    - root
    answer: 0
    explain: The setgid bit makes new entries inherit the directory's group.
  - id: q-9a12a73a1cd2
    q: Why can you not delete another user's file in /tmp, even though /tmp is writable by everyone?
    options:
    - The sticky bit
    - The setuid bit
    - SELinux only
    answer: 0
    explain: With the sticky bit, only the file's owner, the directory's owner or root may remove or rename an entry.
  - id: q-eec853e41ede
    q: In ls -l, the permission string drwxrws--- shows which special bit?
    options:
    - setgid
    - sticky
    - setuid
    answer: 0
    explain: An s in the group x position is setgid; it is lower case because group x is also set.
  - id: q-68f9772a675d
    q: Members of project can read each other's new files in a setgid directory, but not write them. Which is the most likely cause?
    options:
    - The users' umask removes group write
    - setgid is missing
    - The sticky bit is set
    answer: 0
    explain: setgid fixes the group, not the bits. A umask of 022 gives 644; use 002 (or 007) for collaboration, or a default ACL.
