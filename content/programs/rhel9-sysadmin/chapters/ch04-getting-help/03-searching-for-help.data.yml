where-to-look:
  title: Which help to reach for
  caption: Select your situation to see where to look first.
  height: 258
  mode: select
  initial: unknown
  info:
    known:
      tone: purple
      title: You know the command, not the option
      text: Start with COMMAND --help for a short summary; open man COMMAND when you need the details or examples.
    unknown:
      tone: teal
      title: You don't know the command's name
      text: 'Describe what you want in a word or two: man -k "disk space". Try synonyms if nothing turns up.'
    file:
      tone: amber
      title: A configuration file's format
      text: 'File formats are in section 5: man 5 passwd, man 5 fstab. SEE ALSO sections lead to related files.'
    builtin:
      tone: blue
      title: A shell built-in such as cd
      text: type cd says it is a builtin; help cd explains it. Built-ins have no manual page of their own.
    deep:
      tone: green
      title: Examples, design, or a whole task
      text: Package documentation in /usr/share/doc/PACKAGE, and the RHEL documentation online for complete step-by-step guides.
