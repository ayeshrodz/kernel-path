quick:
  questions:
  - id: q-abedb3ebe910
    q: Which command shows the manual page that describes the /etc/passwd file?
    options:
    - man passwd
    - man 5 passwd
    - man 1 passwd
    - man /etc/passwd
    answer: 1
    explain: File formats are in section 5. man passwd opens the first match, passwd(1), the command.
  - id: q-c0327fc784ba
    q: Which manual section holds administration commands such as useradd and mount?
    options:
    - '1'
    - '5'
    - '7'
    - '8'
    answer: 3
    explain: Section 8 is for system administration commands. Section 1 is for commands any user runs, and 5 for file formats.
  - id: q-805b93ff65b9
    q: You are reading a man page. How do you find the next place the word recursive appears?
    options:
    - Press Ctrl+F and type recursive
    - Type /recursive, press Enter, then n for each next match
    - Press q and run grep
    answer: 1
    explain: 'man pages open in less: / searches forward, n repeats the search and N goes back.'
  - id: q-306a7df181be
    q: 'A SYNOPSIS reads: useradd [options] LOGIN. Which command fits it?'
    options:
    - useradd
    - useradd -m alice
    - useradd [options] alice
    answer: 1
    explain: '[options] is optional, and LOGIN is a placeholder for the user name, which is required. The brackets are never typed.'
  - id: q-52a9de5dddba
    q: What does the ... after SOURCE in cp [OPTION]... SOURCE... DIRECTORY mean?
    options:
    - The argument is optional.
    - You may give several source files.
    - The option takes a value.
    answer: 1
    explain: 'Three dots mean the item may be repeated: several sources can be copied into one directory.'
  - id: q-bdd9f255e62b
    q: Which heading of a man page usually gets you to a working command fastest?
    options:
    - NAME
    - EXAMPLES
    - BUGS
    - AUTHOR
    answer: 1
    explain: EXAMPLES shows complete, working command lines. Not every page has one; when it does, start there.
