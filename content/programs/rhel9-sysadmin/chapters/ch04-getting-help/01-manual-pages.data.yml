synopsis:
  title: Reading a SYNOPSIS line
  caption: Select a convention below to highlight where it appears in the two command lines.
  height: 220
  mode: select
  initial: optional
  info:
    literal:
      tone: purple
      title: Type it exactly
      text: 'cp and tar are the command names: type them as shown. In a terminal, man shows these in bold.'
    optional:
      tone: teal
      title: Optional
      text: 'Anything in square brackets may be left out: [OPTION]... means you may give options or none.'
    repeat:
      tone: amber
      title: May be repeated
      text: Three dots mean "one or more". SOURCE... DIRECTORY lets you copy several files into one directory in a single command.
    placeholder:
      tone: blue
      title: Replace with your own value
      text: 'Capitals (underlined in a terminal) are placeholders: SOURCE becomes a file name, DIRECTORY a directory, ARCHIVE the archive file.'
    choice:
      tone: coral
      title: Choose exactly one
      text: 'Braces with bars mean pick one alternative: tar needs exactly one of --create or --extract (among others).'
