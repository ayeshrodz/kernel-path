title: Logical volume management
seoTitle: "LVM Tutorial: Create, Extend and Shrink Volumes (RHCSA)"
seoDescription: "Build LVM volume groups and logical volumes, extend them online with lvextend -r, shrink ext4, replace disks with pvmove and fix problems."
goal: Build storage with LVM, grow and shrink volumes online, replace disks without downtime, and diagnose common LVM problems.
objectives:
  - Describe physical volumes, volume groups and logical volumes, and create and inspect them.
  - Extend logical volumes and their file systems, add disks to a group, and shrink ext4 safely.
  - Move data between disks with pvmove, rename and remove volumes, and make LVM mounts and swap permanent.
  - Diagnose inactive volumes, full groups, busy volumes and missing devices.
objectiveIds:
  - ch18.concepts
  - ch18.resize
  - ch18.maintenance
  - ch18.troubleshooting
