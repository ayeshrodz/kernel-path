quick:
  questions:
  - id: q-2ce12a64c32b
    q: Where would you look for the settings of the SSH server?
    options:
    - /usr/bin
    - /etc
    - /var
    - /run
    answer: 1
    explain: System-wide configuration lives in /etc; the SSH server reads /etc/ssh/sshd_config.
  - id: q-48470a50eb98
    q: A service writes its log while it runs, and the log must survive a reboot. Where does it belong?
    options:
    - /run
    - /tmp
    - /var/log
    - /usr
    answer: 2
    explain: Variable, persistent data goes under /var. /run is emptied at boot, /tmp is cleaned automatically, and /usr is for installed software.
  - id: q-cf12a22677da
    q: What is the home directory of the root user?
    options:
    - /home/root
    - /
    - /root
    - /etc/root
    answer: 2
    explain: root's home is /root, outside /home, so the administrator can still work if /home is unavailable.
  - id: q-b4cb9ad60bee
    q: Why do /bin/ls and /usr/bin/ls show the same file on RHEL 9?
    options:
    - The package was installed twice.
    - /bin is a symbolic link to usr/bin.
    - The shell searches both directories.
    answer: 1
    explain: ls -l / shows bin -> usr/bin. /sbin, /lib and /lib64 are links into /usr in the same way.
  - id: q-30316e9bddcd
    q: How many files are notes.txt, Notes.txt and NOTES.txt in one directory?
    options:
    - One
    - Three
    answer: 1
    explain: Linux file names are case-sensitive, so these are three different files.
