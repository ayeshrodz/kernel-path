hierarchy:
  title: The main directories under /
  caption: Select a directory to read what it holds.
  height: 318
  mode: select
  initial: etc
  info:
    boot:
      tone: amber
      title: '/boot: starting the system'
      text: The kernel (vmlinuz-…), the initial RAM disk it loads first, and the boot loader configuration. You rarely change anything here by hand.
    dev:
      tone: gray
      title: '/dev: devices as files'
      text: 'Each disk, partition and terminal appears as a special file: /dev/sda is the first disk, /dev/sdb your lab servers'' spare disk. The system builds this directory at every boot.'
    etc:
      tone: purple
      title: '/etc: configuration'
      text: 'System-wide settings, almost all as plain text: users in /etc/passwd, the host name in /etc/hostname, the SSH server''s settings in /etc/ssh/sshd_config. This is where an administrator edits
        most often.'
    home:
      tone: green
      title: '/home: users'' home directories'
      text: Each ordinary user has a directory here, such as /home/student, for their files and personal settings. The shell starts there when they log in.
    student:
      tone: green
      title: '/home/student: your home'
      text: Your own files and hidden settings files such as .bashrc. The ~ in the prompt is shorthand for it.
    root:
      tone: coral
      title: '/root: the superuser''s home'
      text: root's home directory is kept outside /home, so it is still available if /home is on a separate disk that fails to mount.
    run:
      tone: blue
      title: '/run: runtime data'
      text: Process ID files, sockets and locks for programs running now. It lives in memory and is empty again after every reboot.
    tmp:
      tone: gray
      title: '/tmp: temporary files'
      text: Anyone can create files here. Files untouched for 10 days are deleted automatically (30 days in /var/tmp), so never keep anything important in it.
    usr:
      tone: teal
      title: '/usr: installed software'
      text: 'Programs, libraries and documentation installed from packages. Static content: it changes when you install or update software, not while the system runs.'
    bin:
      tone: teal
      title: '/usr/bin: commands for everyone'
      text: ls, cat, ssh, tar and most other commands. /bin is a link to it.
    sbin:
      tone: teal
      title: '/usr/sbin: administration commands'
      text: Commands mainly for root, such as useradd, fdisk and sshd. /sbin is a link to it.
    local:
      tone: teal
      title: '/usr/local: locally built software'
      text: Software you build or install yourself, outside the package manager, so updates never overwrite it.
    var:
      tone: amber
      title: '/var: variable data'
      text: 'Data that grows and changes while the system runs and must survive a reboot: logs, databases, caches, mail queues, web content.'
    log:
      tone: amber
      title: '/var/log: logs'
      text: Log files such as /var/log/messages and /var/log/secure. Chapter 11 is about reading them.
    lib:
      tone: amber
      title: '/var/lib: program state'
      text: 'Where services keep their data: databases, package manager records, container images.'
