navigation:
  title: A walk around servera with cd
  caption: Step through the commands. The highlighted directory is where the shell is after each one.
  height: 260
  mode: steps
  steps:
  - title: pwd
    text: You start in your home directory, /home/student. pwd prints it.
  - title: cd /var/log
    text: 'An absolute path: the shell starts at / and goes down through var to log, wherever you were.'
  - title: cd ..
    text: .. is the parent directory. From /var/log, that is /var.
  - title: cd log
    text: 'A relative path: log is looked up inside the current directory, /var.'
  - title: cd
    text: cd on its own goes home, from anywhere.
  - title: cd -
    text: Back to the previous directory, /var/log. cd prints where it went.
