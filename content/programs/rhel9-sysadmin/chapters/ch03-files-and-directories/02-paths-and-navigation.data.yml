long-listing:
  title: One line of ls -l
  caption: Select each field to see what it tells you.
  height: 140
  mode: select
  initial: type
  info:
    type:
      tone: blue
      title: File type
      text: '- is a regular file, d a directory, l a symbolic link. Others you will meet: c and b for devices in /dev.'
    perms:
      tone: purple
      title: Permissions
      text: 'Who may read (r), write (w) and execute (x) it: three letters for the owner, three for the group, three for everyone else. Chapter 7 explains them.'
    dot:
      tone: gray
      title: SELinux label
      text: The dot says the file also has an SELinux security label. Chapter 16 shows how to read it with ls -Z.
    links:
      tone: teal
      title: Link count
      text: How many names (hard links) the file has. For a directory, it also counts its subdirectories' .. entries.
    owner:
      tone: coral
      title: Owner
      text: The user who owns the file.
    group:
      tone: coral
      title: Group
      text: The group that owns the file.
    size:
      tone: amber
      title: Size
      text: The size in bytes. Add -h to see sizes such as 4.0K or 12M.
    date:
      tone: gray
      title: Last modified
      text: When the content last changed. Older files show the year instead of the time.
    name:
      tone: green
      title: Name
      text: The file's name, as you gave it to ls. A symbolic link adds -> and its target.
