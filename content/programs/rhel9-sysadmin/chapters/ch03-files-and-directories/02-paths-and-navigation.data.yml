quick:
  questions:
  - id: q-3cce541093dd
    q: You are in /var. Which path names /var/log/messages relatively?
    options:
    - /log/messages
    - log/messages
    - ../log/messages
    - ~/log/messages
    answer: 1
    explain: A relative path starts from the current directory and does not begin with /. log/messages inside /var is /var/log/messages.
  - id: q-faf4747c0382
    q: You are in /home/student/projects/web. Where does cd ../.. take you?
    options:
    - /home
    - /home/student
    - /
    - /home/student/projects
    answer: 1
    explain: 'Each .. goes up one level: web → projects → student.'
  - id: q-b5d9573b8001
    q: Which command takes you back to the directory you were in before the last cd?
    options:
    - cd ..
    - cd ~
    - cd -
    - cd .
    answer: 2
    explain: cd - returns to the previous directory and prints it. cd .. goes to the parent, cd ~ goes home and cd . stays put.
  - id: q-7232397d007c
    q: ls -l shows a line that starts with d. What is it?
    options:
    - A deleted file
    - A directory
    - A device
    - A symbolic link
    answer: 1
    explain: 'The first character is the file type: - regular file, d directory, l symbolic link.'
  - id: q-728cf454b8c2
    q: Why does ls not show .bashrc in your home directory?
    options:
    - It is protected by permissions.
    - Names starting with a dot are hidden; ls -a shows them.
    - Only root can see it.
    answer: 1
    explain: Hidden files are a convention to reduce clutter, not a security feature. ls -a lists them.
  - id: q-f400d565b650
    q: You run rm my report.txt to delete a file named "my report.txt". What happens?
    options:
    - The file is deleted.
    - rm tries to delete two files, my and report.txt.
    - rm asks which file you meant.
    answer: 1
    explain: The shell splits arguments at spaces. Quote the name, "my report.txt", or let Tab completion escape it.
