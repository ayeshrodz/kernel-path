quick:
  questions:
  - id: q-65005f90bc7a
    q: ls -l shows a link count of 3 for a regular file. What does that mean?
    options:
    - It has been opened three times.
    - It has three names (hard links) pointing to the same data.
    - Three symbolic links point to it.
    answer: 1
    explain: 'The link count counts hard links: directory entries for the same inode. Symbolic links are not counted.'
  - id: q-36f70502a7ad
    q: You remove the original name of a file that also has a hard link. What happens to the data?
    options:
    - It is deleted.
    - It stays, reachable through the other name.
    - It moves to /tmp.
    answer: 1
    explain: Data is freed only when the last hard link is removed. The other name is just as real as the first.
  - id: q-441bef771340
    q: Which needs a symbolic link rather than a hard link?
    options:
    - A second name for a file in the same directory
    - A short name for the directory /var/log
    - A second name for a file on the same file system
    answer: 1
    explain: Hard links cannot point to directories or cross file systems. Symbolic links can do both.
  - id: q-7ea7a5619b18
    q: What does ls -l show for a symbolic link?
    options:
    - A leading l, and -> followed by its target
    - A link count of 2
    - The same inode number as its target
    answer: 0
    explain: The type character is l and the listing ends with -> target. A symbolic link has its own inode.
  - id: q-c610e1eec207
    q: A symbolic link points to a file that has been deleted. What is the link called, and what does cat print?
    options:
    - Orphaned; the old content
    - Dangling; No such file or directory
    - Hidden; nothing
    answer: 1
    explain: The link still exists but leads nowhere, so opening it fails. Recreate the target name and it works again.
