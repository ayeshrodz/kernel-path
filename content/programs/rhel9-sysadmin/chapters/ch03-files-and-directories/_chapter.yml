title: Files and directories
seoTitle: "Linux Files and Directories: ls, cp, mv, rm, ln (RHCSA)"
seoDescription: "Navigate the Linux directory tree, use absolute and relative paths, copy, move and delete files, and create hard and symbolic links."
goal: Find your way around the Linux directory tree, and create, copy, move, link and remove files from the shell, using patterns to work on many files at once.
objectives:
  - Describe how Linux organises files in one directory tree, and what the main directories hold.
  - Name files with absolute and relative paths, move around with cd, and list directories with ls.
  - Create, copy, move, rename and remove files and directories.
  - Give a file more than one name with hard links and symbolic links, and explain how they differ.
  - Use shell expansions (patterns, braces, the tilde, variables and command substitution) and quoting to work on many files at once.
objectiveIds:
  - ch03.hierarchy
  - ch03.paths
  - ch03.manage
  - ch03.links
  - ch03.expansion
