destination-rule:
  title: Where does the file end up?
  caption: Select a command. The result depends only on whether the destination is an existing directory.
  height: 278
  mode: select
  initial: cp-name
  info:
    cp-name:
      tone: teal
      title: cp plan.txt plan-v1.txt
      text: 'A new name: a second, independent copy appears beside the original.'
    cp-dir:
      tone: teal
      title: cp plan.txt reports/
      text: reports is an existing directory, so the copy goes inside it with the same name.
    mv-name:
      tone: purple
      title: mv plan.txt plan-final.txt
      text: 'A new name in the same place: the file is renamed. Only one file exists afterwards.'
    mv-dir:
      tone: purple
      title: mv plan.txt reports/
      text: reports is an existing directory, so the file moves inside it. Nothing is left behind.
