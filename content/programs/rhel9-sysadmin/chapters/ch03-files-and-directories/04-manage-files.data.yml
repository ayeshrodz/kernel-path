quick:
  questions:
  - id: q-0f24d3551e61
    q: reports is an existing directory. What does cp plan.txt reports do?
    options:
    - Renames plan.txt to reports.
    - Copies plan.txt into reports/, keeping its name.
    - Fails, because reports already exists.
    answer: 1
    explain: When the destination is an existing directory, the file goes inside it. Only when it is not a directory is the destination a new name.
  - id: q-38a1bc6f4f60
    q: How do you rename notes.txt to minutes.txt?
    options:
    - rename notes.txt minutes.txt
    - cp notes.txt minutes.txt
    - mv notes.txt minutes.txt
    answer: 2
    explain: Renaming is moving to a new name. cp would leave the original as well.
  - id: q-3230ec13e4d4
    q: cp prints "-r not specified; omitting directory". What happened?
    options:
    - Nothing was copied at all.
    - The directory was skipped; any files in the same command were copied.
    - The directory was copied without its contents.
    answer: 1
    explain: cp copies directories only with -r. Files listed in the same command are still copied.
  - id: q-8e14c373ed92
    q: Which command creates /srv/web/site/assets when none of those directories exist?
    options:
    - mkdir /srv/web/site/assets
    - mkdir -p /srv/web/site/assets
    - mkdir -r /srv/web/site/assets
    answer: 1
    explain: -p creates every missing directory along the path. Without it, mkdir fails because the parent is missing.
  - id: q-91e50ce41ed2
    q: Which removes the directory old only if it is empty?
    options:
    - rm old
    - rm -r old
    - rmdir old
    answer: 2
    explain: rmdir refuses non-empty directories, which makes it safe. rm -r removes everything inside, and plain rm refuses directories.
  - id: q-7581c1772ee5
    q: You deleted the wrong file with rm. Where can you get it back from?
    options:
    - The wastebasket in your home directory
    - 'Nowhere on the system: only from a backup'
    - rm --undo
    answer: 1
    explain: Command-line rm does not use a wastebasket. That is why you check with pwd and ls first, and why backups matter.
