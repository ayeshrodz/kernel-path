title: Scripts and scheduling
seoTitle: "Bash Scripting, cron and systemd Timers (RHCSA)"
seoDescription: "Write Bash scripts with arguments, conditions and loops, and schedule jobs with cron, systemd timers and at. RHCSA (EX200) chapter 15."
goal: Write shell scripts with arguments, tests and loops, and schedule them with cron, systemd timers and at.
objectives:
  - Write and run a bash script, with variables, arguments and exit statuses.
  - Use tests, if, case, for and while to make a script decide and repeat.
  - Schedule jobs with crontab and /etc/cron.d, and diagnose cron problems from its log.
  - Create systemd timers and one-off at jobs, and choose the right scheduler.
objectiveIds:
  - ch15.scripts
  - ch15.logic
  - ch15.cron
  - ch15.timers
