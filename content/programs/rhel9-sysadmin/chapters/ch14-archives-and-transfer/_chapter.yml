title: Archives and file transfer
seoTitle: "tar, Compression, Backups and rsync (RHCSA)"
seoDescription: "Create and extract tar archives, compress with gzip, bzip2 and xz, verify checksums, back up with ACLs and copy data safely with rsync."
goal: Bundle and compress data with tar, prove it with checksums, make backups that restore with their metadata, and move data between hosts safely.
objectives:
  - Create, list and extract tar archives and choose the compression.
  - Compress and compare formats, and verify files with SHA-256 checksums.
  - Make full and incremental backups that keep ACLs, labels and attributes, and test restores.
  - Move data between hosts with rsync and tar over ssh, and verify the copy.
objectiveIds:
  - ch14.tar
  - ch14.checksums
  - ch14.backups
  - ch14.transfer
