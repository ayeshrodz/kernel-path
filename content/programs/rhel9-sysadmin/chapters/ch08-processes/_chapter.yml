title: Processes
seoTitle: "Linux Processes: ps, kill, jobs, nice and top (RHCSA)"
seoDescription: "Inspect Linux processes with ps and top, run jobs in the background, send signals with kill and tune priority with nice and tuned."
goal: See what is running, control jobs and signals, and judge and tune how processes share the machine.
objectives:
  - Explain processes, PIDs and states, and list and trace them with ps, pstree and /proc.
  - Run commands in the background and control them with jobs, fg, bg and nohup.
  - Send signals with kill, pkill and killall, and end processes safely with the right escalation.
  - Read load average, top and free, change priority with nice and renice, and select a tuned profile.
objectiveIds:
  - ch08.processes
  - ch08.jobs
  - ch08.signals
  - ch08.monitoring
