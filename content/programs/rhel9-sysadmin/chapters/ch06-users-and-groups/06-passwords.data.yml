quick:
  questions:
  - id: q-d87b159be436
    q: Which command forces ops1 to choose a new password at the next login?
    options:
    - passwd -l ops1
    - chage -d 0 ops1
    - chage -M 0 ops1
    answer: 1
    explain: Setting the last change to day 0 makes the password count as expired. passwd -l locks it instead.
  - id: q-2a2d5d485b0d
    q: Passwords on a server must change every 60 days, with 5 days of warning. Which command sets that for alice?
    options:
    - chage -M 60 -W 5 alice
    - chage -m 60 -W 5 alice
    - chage -E 60 alice
    answer: 0
    explain: -M is the maximum age and -W the warning period. -m is the minimum, and -E an account expiry date.
  - id: q-222259d6b0a0
    q: A contractor's account must stop working on 31 December 2026. Which command does that?
    options:
    - chage -M 2026-12-31 contractor
    - chage -E 2026-12-31 contractor
    - usermod -L contractor
    answer: 1
    explain: -E sets the account expiry date. Locking would block password logins straight away, and only password logins.
  - id: q-5f1525141444
    q: You lock an account with usermod -L. Can its user still log in?
    options:
    - No, never.
    - Not with the password, but yes with an SSH key.
    - Yes, because locking only affects sudo.
    answer: 1
    explain: Locking breaks the password hash; key-based SSH logins don't use it. Expire the account to block everything.
  - id: q-ec84cbd43f39
    q: You change PASS_MAX_DAYS in /etc/login.defs to 90. What happens to existing accounts?
    options:
    - They all get a 90-day maximum.
    - Nothing; only accounts created afterwards use the new default.
    - They expire immediately.
    answer: 1
    explain: login.defs supplies defaults when an account is created. Existing accounts need chage.
  - id: q-65d65cc2e90b
    q: What does passwd -S ops1 report as LK?
    options:
    - The password is locked.
    - The account is a system account.
    - The password was set today.
    answer: 0
    explain: 'passwd -S summarises the status: LK locked, PS password set, NP no password.'
