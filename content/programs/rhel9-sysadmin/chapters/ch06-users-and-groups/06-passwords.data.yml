ageing:
  title: The life of a password
  caption: Step through a password with a 90-day maximum age, a 1-day minimum and a 7-day warning.
  height: 180
  mode: steps
  steps:
  - title: 'Day 0: the password is set'
    text: chage -l calls this the last password change. The clock starts here.
  - title: 'Day 0 to 1: minimum age'
    text: With -m 1, the user can't change the password again for one day, which stops them cycling straight back to an old favourite.
  - title: 'Day 83 to 90: warning period'
    text: With -W 7, for the seven days before expiry, every login warns that the password will expire soon.
  - title: 'Day 90: the password expires'
    text: With -M 90, the user must choose a new password at their next login before they get a shell.
  - title: Inactive period
    text: With -I, if the password stays expired for that many more days, the account is disabled and only an administrator can help.
  - title: Account expiry
    text: 'Separate from the password: with -E DATE, the whole account stops working on that date, whatever the password.'
