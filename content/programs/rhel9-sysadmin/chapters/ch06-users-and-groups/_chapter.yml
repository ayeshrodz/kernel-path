title: Users and groups
seoTitle: "Linux Users and Groups: useradd, sudo, passwd (RHCSA)"
seoDescription: "Create and manage Linux users and groups, grant sudo access safely and set password ageing with chage. RHCSA (EX200) chapter 6."
goal: Create and manage local user accounts and groups, give administrators controlled root access with sudo, and set password policies.
objectives:
  - Explain users, groups, UIDs and GIDs, and read the account databases /etc/passwd, /etc/group and /etc/shadow.
  - Become root with su or run commands as root with sudo, and grant sudo access with drop-in files checked by visudo.
  - Create, modify and delete user accounts and groups, including supplementary group membership.
  - Set, lock and age passwords, force a change at the next login, and make accounts expire.
objectiveIds:
  - ch06.concepts
  - ch06.superuser
  - ch06.accounts
  - ch06.passwords
