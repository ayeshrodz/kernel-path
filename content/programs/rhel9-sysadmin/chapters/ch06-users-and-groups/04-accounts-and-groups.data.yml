quick:
  questions:
  - id: q-4bcbd342f2fd
    q: alice is in wheel and docker. After usermod -G devteam alice, which supplementary groups does she have?
    options:
    - wheel, docker and devteam
    - Only devteam
    - wheel and docker
    answer: 1
    explain: -G replaces the whole list. To add a group while keeping the others, use usermod -aG devteam alice.
  - id: q-a6fa55408fe1
    q: Which command creates a service account svc-backup that can't log in interactively?
    options:
    - useradd -s /sbin/nologin svc-backup
    - useradd -L svc-backup
    - useradd -M svc-backup
    answer: 0
    explain: The nologin shell refuses interactive logins. -M only skips the home directory.
  - id: q-252168ea5422
    q: A new account shows !! in /etc/shadow. Why can't it log in?
    options:
    - It is locked by policy.
    - No password has been set yet.
    - Its home directory is missing.
    answer: 1
    explain: useradd creates the account without a password. passwd USER sets one.
  - id: q-00c2774ca8b1
    q: Where do you put a file so every new user gets a copy in their home directory?
    options:
    - /etc/skel
    - /etc/default
    - /home/skel
    answer: 0
    explain: useradd copies /etc/skel into each new home directory.
  - id: q-5b00c8d74c32
    q: What does userdel bob leave behind that userdel -r bob removes?
    options:
    - bob's entry in /etc/passwd
    - bob's home directory and mail spool
    - bob's supplementary groups
    answer: 1
    explain: Without -r, the files stay, owned by bob's old UID, which a future account could inherit.
  - id: q-378f4c69ac99
    q: Which adds the existing user carol to the existing group auditors?
    options:
    - gpasswd -a carol auditors
    - groupmod -a carol auditors
    - useradd -G auditors carol
    answer: 0
    explain: gpasswd -a adds a member. usermod -aG auditors carol works too. useradd would try to create carol.
