useradd-steps:
  title: What useradd does
  caption: Step through what one useradd command changes.
  height: 216
  mode: steps
  steps:
  - title: Pick a UID and GID
    text: 'The next free number at or above 1000 (UID_MIN in /etc/login.defs): 1001 here.'
  - title: Add a line to /etc/passwd
    text: ops1:x:1001:1001::/home/ops1:/bin/bash. Empty comment, default home and shell.
  - title: Create a private group
    text: 'A group with the same name and GID, added to /etc/group: ops1:x:1001:'
  - title: Add a line to /etc/shadow
    text: 'With !! instead of a hash: no password yet, so nobody can log in as ops1.'
  - title: Create the home directory
    text: /home/ops1, owned by ops1, mode 700 (HOME_MODE), so only ops1 can enter it.
  - title: Copy the files from /etc/skel
    text: '.bashrc, .bash_profile and .bash_logout: the starting shell settings every user gets. Put a file in /etc/skel and every new user receives a copy.'
  elements:
  - kind: node
    x: 250
    y: 10
    w: 180
    h: 40
    tone: purple
    title: useradd ops1
    mono: true
