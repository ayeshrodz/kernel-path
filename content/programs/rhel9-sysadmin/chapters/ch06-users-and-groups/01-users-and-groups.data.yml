quick:
  questions:
  - id: q-5571725b1b8f
    q: Which UID always belongs to root?
    options:
    - '0'
    - '1'
    - '1000'
    - '65534'
    answer: 0
    explain: UID 0 is the superuser, whatever the account is called. Regular users start at 1000.
  - id: q-582294dea59b
    q: What is a user's primary group?
    options:
    - The first supplementary group they join
    - The one group recorded in their /etc/passwd line, which new files they create belong to
    - The wheel group
    answer: 1
    explain: Every user has exactly one primary group, by GID in field 4 of /etc/passwd. Supplementary groups are listed in /etc/group.
  - id: q-9a3cde797ed3
    q: Why does /etc/passwd contain x instead of a password?
    options:
    - The password is blank.
    - The hash is kept in /etc/shadow, which only root can read.
    - The account is locked.
    answer: 1
    explain: /etc/passwd must be readable by every program, so the hashes moved to the protected /etc/shadow.
  - id: q-0a8f3ea11a0d
    q: In /etc/shadow, the password field of an account starts with !. What does that mean?
    options:
    - The password is locked.
    - The password never expires.
    - The account is a system account.
    answer: 0
    explain: A leading ! makes the hash impossible to match, so password logins fail. !! alone means no password was ever set.
  - id: q-2aecd5870fdd
    q: A service account should never log in interactively. Which login shell does that?
    options:
    - /bin/bash
    - /sbin/nologin
    - /home/nologin
    answer: 1
    explain: /sbin/nologin prints a polite refusal and exits, so the account can own files and run processes but not log in.
  - id: q-cf88e4f5e551
    q: The line developers:x:3000:alice,bob is in /etc/group, and carol's primary GID is 3000. Who is in the group?
    options:
    - Only alice and bob
    - alice, bob and carol
    - Only carol
    answer: 1
    explain: The member list shows supplementary members; carol belongs through her primary GID.
