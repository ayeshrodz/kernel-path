passwd-line:
  title: One line of /etc/passwd
  caption: Select a field to see what it holds.
  height: 170
  mode: select
  initial: name
  info:
    name:
      tone: purple
      title: User name
      text: The login name. Must be unique on the system.
    pw:
      tone: gray
      title: Password placeholder
      text: 'Always x today: the real password hash is in /etc/shadow, which only root can read.'
    uid:
      tone: blue
      title: UID
      text: The user ID number. The system uses this number, not the name.
    gid:
      tone: teal
      title: Primary GID
      text: The GID of the user's primary group, here the student group.
    gecos:
      tone: amber
      title: Comment (GECOS)
      text: Free text, usually the person's full name. Set with useradd -c or usermod -c.
    home:
      tone: green
      title: Home directory
      text: Where the user starts after logging in, and where their personal files and settings live.
    shell:
      tone: coral
      title: Login shell
      text: The program started at login. /sbin/nologin refuses interactive logins, which is used for service accounts.
