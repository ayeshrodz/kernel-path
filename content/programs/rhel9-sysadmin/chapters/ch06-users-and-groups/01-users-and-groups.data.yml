shadow-line:
  title: One line of /etc/shadow
  caption: Select a field. Dates count days since 1 January 1970.
  height: 170
  mode: select
  initial: name
  info:
    name:
      tone: purple
      title: User name
      text: Matches the name in /etc/passwd.
    hash:
      tone: gray
      title: Password hash
      text: $6$ is SHA-512, then the salt and the hash. !! means no password set yet; a leading ! means locked.
    last:
      tone: blue
      title: Last change
      text: The day the password was last changed. 0 forces a change at the next login.
    min:
      tone: teal
      title: Minimum age
      text: Days that must pass before the password can be changed again.
    max:
      tone: teal
      title: Maximum age
      text: Days after the last change when the password expires. 99999 means effectively never.
    warn:
      tone: amber
      title: Warning period
      text: Days before expiry when the user starts seeing warnings.
    inactive:
      tone: coral
      title: Inactivity period
      text: Days after expiry when the account is disabled if the password still has not been changed. Empty means never.
    expire:
      tone: red
      title: Account expiry
      text: The day the whole account stops working, whatever the password. Empty means never.
    reserved:
      tone: gray
      title: Reserved
      text: Not used.
  elements:
