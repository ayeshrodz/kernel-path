line-editing:
  title: What each editing shortcut does
  caption: The cursor (amber) sits after -n 20. Select a shortcut to see where the cursor jumps, or what is deleted (red).
  height: 200
  mode: select
  initial: ctrl-a
  info:
    ctrl-a:
      tone: blue
      title: Ctrl+A jumps to the start
      text: The cursor moves before tail, so you can add something in front, such as sudo.
    ctrl-e:
      tone: blue
      title: Ctrl+E jumps to the end
      text: The cursor moves after the file name, ready to add another argument.
    ctrl-u:
      tone: red
      title: Ctrl+U deletes back to the start
      text: Everything before the cursor goes, here tail -n 20. Handy for clearing a mistyped beginning while keeping the rest.
    ctrl-k:
      tone: red
      title: Ctrl+K deletes to the end
      text: Everything after the cursor goes, here the file name, so you can type a different one.
    ctrl-left:
      tone: teal
      title: Ctrl+← jumps one word left
      text: The cursor moves to the start of the word before it, here to the start of 20, then -n on the next press.
    ctrl-right:
      tone: teal
      title: Ctrl+→ jumps one word right
      text: The cursor moves to the end of the next word, here after /var/log/messages.
  elements:
    - kind: node
      x: 18
      y: 30
      w: 12
      h: 44
      tone: blue
      title: ""
      active:
        - ctrl-a
    - kind: node
      x: 36
      y: 30
      w: 100
      h: 44
      tone: gray
      title: tail
      mono: true
      hot:
        - ctrl-u
    - kind: node
      x: 144
