quick:
  questions:
    - id: q-b5e09969f187
      q: What does the Linux kernel do?
      options:
        - It reads the commands you type and runs programs.
        - It shares the processor, memory, disks and network between all running programs.
        - It installs and updates software packages.
        - It draws the desktop and windows.
      answer: 1
      explain: The kernel is the core that manages the hardware for every other program. Reading your commands is the shell's job, and installing packages is the package manager's.
    - id: q-f15b25e9bd56
      q: Why is Rocky Linux a good practice system for RHEL 9?
      options:
        - It is a newer version of RHEL with extra features.
        - It is built from the same published source as RHEL 9, so commands, packages and paths match.
        - It uses a different kernel that is easier to learn.
      answer: 1
      explain: Rocky rebuilds the RHEL source. What differs is the branding and the subscription services, not the administration you practise.
    - id: q-7de7f8b324e0
      q: "Your prompt reads [root@serverb ~]#. What does it tell you?"
      options:
        - You are student on serverb, in your home directory.
        - You are root on serverb, in root's home directory, and can change anything on the system.
        - You are root on workstation, about to connect to serverb.
      answer: 1
      explain: The user comes before the @, the host after it, then the current directory. The # confirms a root shell.
    - id: q-027e185a357a
      q: "In ls -l --all /etc, which part is the argument?"
      options:
        - "ls"
        - "-l"
        - "--all"
        - "/etc"
      answer: 3
      explain: ls is the command, -l and --all are options (one short, one long), and /etc is what the command works on.
    - id: q-48c37c079eb2
      q: The first time you SSH to a server, it shows a key fingerprint and asks whether to continue. What happens if you answer yes?
      options:
        - SSH sends your password to the server in plain text.
        - SSH saves the server's host key and checks it silently on every later connection.
        - SSH stops asking for your password on that server.
      answer: 1
      explain: The host key is saved in ~/.ssh/known_hosts. If it ever changes, SSH refuses to connect, which protects you from impostors. Passwords are still needed unless you set up keys.
    - id: q-d43137d32591
      q: Which two ways end an SSH session and return you to the previous machine?
      options:
        - exit or Ctrl+D
        - logout or Ctrl+C
        - quit or Ctrl+Z
      answer: 0
      explain: exit and Ctrl+D (end of input) both close the remote shell. Ctrl+C interrupts a running command, and Ctrl+Z suspends one.
