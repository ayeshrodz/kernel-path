prompt-anatomy:
  title: The parts of the prompt
  caption: Select a part of the prompt to see what it tells you.
  height: 170
  mode: select
  initial: user
  info:
    user:
      tone: purple
      title: The user you are logged in as
      text: Here, student. After sudo -i it changes to root. If you ever wonder, the whoami command prints it.
    host:
      tone: blue
      title: The machine you are on
      text: The short host name, workstation here. After ssh student@servera it reads servera. Check it before every command that changes something.
    dir:
      tone: teal
      title: Your current directory
      text: The tilde (~) is shorthand for your home directory, /home/student. When you move to /etc, it reads etc. The pwd command prints the full path.
    sign:
      tone: coral
      title: Ordinary user or root
      text: $ means an ordinary user, who can change only their own files. # means root, the superuser, who can change anything on the system.
  elements:
    - kind: node
      x: 20
      y: 30
      w: 150
      h: 62
      tone: purple
      title: student
      sub: who you are
      mono: true
      select: user
      active:
        - user
    - kind: node
      x: 182
      y: 30
      w: 196
      h: 62
      tone: blue
      title: workstation
      sub: which machine
      mono: true
      select: host
      active:
        - host
    - kind: node
      x: 390
      y: 30
      w: 120
      h: 62
      tone: teal
      title: "~"
      sub: where you are
      mono: true
      select: dir
      active:
        - dir
    - kind: node
      x: 522
      y: 30
      w: 140
      h: 62
      tone: coral
      title: $
      sub: user or root
      mono: true
      select: sign
      active:
        - sign
    - kind: label
      x: 340
      y: 135
      text: "[student@workstation ~]$"
      size: 17
      mono: true
command-anatomy:
  title: The parts of a command
  caption: Select each part of the command to see its role.
  height: 160
  mode: select
  initial: cmd
  info:
    cmd:
      tone: purple
      title: The command
      text: The name of the program to run, always first. head prints the beginning of a file.
    opt:
      tone: amber
      title: An option, with a value
      text: Options start with a dash and change the behaviour. -n 3 asks for three lines instead of the default ten. The long form is --lines=3.
    arg:
      tone: teal
      title: The argument
      text: What the command works on, here the file /etc/passwd. Many commands accept several arguments, for example head -n 3 /etc/passwd /etc/group.
  elements:
    - kind: node
      x: 60
      y: 30
      w: 140
      h: 62
      tone: purple
      title: head
      sub: command
      mono: true
