    words:
      - /etc/passwd
      - /etc/group
      - /etc/hostname
      - /etc/redhat-release
      - /usr/bin/passwd
      - /home
quick:
  questions:
    - id: q-73c9f84efdcf
      q: Which command prints only the last five lines of /var/log/messages?
      options:
        - "`head -n 5 /var/log/messages`"
        - "`tail -n 5 /var/log/messages`"
        - "`tail 5 /var/log/messages`"
        - "`less -n 5 /var/log/messages`"
      answer: 1
      explain: tail prints the end of a file, and -n sets how many lines. Without -n, tail would treat 5 as a file name.
    - id: q-5ef03238b440
      q: A file is called backup.txt. How do you find out whether it really is text?
      options:
        - Trust the .txt extension.
        - Run file backup.txt, which looks at the content.
        - Run wc backup.txt.
      answer: 1
      explain: Linux ignores extensions. file reads the start of the file and reports what it really is, for example gzip compressed data.
    - id: q-da08fa02e8bb
      q: What does the semicolon do in date ; whoami?
      options:
        - Passes the output of date to whoami.
        - Runs date, then whoami, as two separate commands on one line.
        - Runs whoami only if date succeeds.
      answer: 1
      explain: A semicolon simply separates commands. Passing output between commands is the pipe (|), which chapter 5 covers.
    - id: q-5ee126aa8c6b
      q: You type a long command, end the line with a backslash and press Enter. What happens?
      options:
        - The command runs immediately.
        - The shell waits for the rest of the command on the next line, showing a > prompt.
        - The shell reports a syntax error.
      answer: 1
      explain: The backslash escapes the newline, so the command continues. Don't type the > yourself; it is the shell's secondary prompt.
    - id: q-ac3e9fb424a7
      q: How do you quit less and get your prompt back?
      options:
        - Ctrl+D
        - q
        - Esc
        - exit
      answer: 1
      explain: q quits less (and manual pages, which use less). Space and b page forward and back, and / searches.
