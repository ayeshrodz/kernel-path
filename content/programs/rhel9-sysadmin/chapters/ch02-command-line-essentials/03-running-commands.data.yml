practice:
  text:
    hint: Click here and type a command, then press Enter. Try Tab after a few letters, and the up arrow to bring back a command.
    inputLabel: Command to run in the practice terminal
    eventNotFound: "bash: {value0}: event not found"
    notHere: This practice terminal only knows the exact commands in this lesson. Try it on the lab, where every command works.
    notFound: "bash: {value0}: command not found"
    searchPrompt: "(reverse-i-search)`{value0}':"
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now try the same on workstation.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: "Practice terminal: run commands and read files"
    prompt: "[student@workstation ~]$"
    tasks:
      - text: Print today's date and time.
        commands:
          - date
      - text: Print only the time, on a 24-hour clock.
        commands:
          - date +%R
      - text: Find out what kind of file /usr/bin/passwd is.
        commands:
          - file /usr/bin/passwd
      - text: Show the first five lines of /etc/passwd.
        commands:
          - head -n 5 /etc/passwd
          - head -5 /etc/passwd
      - text: Show only the last three lines of /etc/passwd.
        commands:
          - tail -n 3 /etc/passwd
          - tail -3 /etc/passwd
      - text: Count the lines of /etc/passwd and /etc/group with one command.
        commands:
          - wc -l /etc/passwd /etc/group
          - wc -l /etc/group /etc/passwd
    commands:
      - cmd: whoami
        out: student
      - cmd: hostname
        out: workstation.lab.example.com
      - cmd: date
        out: Sat Oct  3 09:30:23 AM UTC 2026
      - cmd: date +%R
        out: "09:30"
      - cmd: date +%x
        out: 10/03/2026
      - cmd: date +%A
        out: Saturday
      - cmd: date +%Y-%m-%d
        out: "2026-10-03"
      - cmd: uptime
        out: " 09:34:53 up 7 min,  0 users,  load average: 0.08, 0.06, 0.04"
      - cmd: file /etc/passwd
        out: "/etc/passwd: ASCII text"
      - cmd: file /usr/bin/passwd
        out: "/usr/bin/passwd: setuid ELF 64-bit LSB pie executable, x86-64, version 1 (SYSV), dynamically linked, interpreter /lib64/ld-linux-x86-64.so.2, BuildID[sha1]=3e7d2823ae1f6faa96ad82397a23238094040086, for GNU/Linux 3.2.0, stripped"
      - cmd: file /home
        out: "/home: directory"
      - cmd: file /etc/hostname
        out: "/etc/hostname: ASCII text"
      - cmd: cat /etc/hostname
        out: workstation.lab.example.com
      - cmd: cat /etc/redhat-release
        out: Rocky Linux release 9.8 (Blue Onyx)
      - cmd: head /etc/passwd
        out: |
          root:x:0:0:root:/root:/bin/bash
          bin:x:1:1:bin:/bin:/sbin/nologin
          daemon:x:2:2:daemon:/sbin:/sbin/nologin
