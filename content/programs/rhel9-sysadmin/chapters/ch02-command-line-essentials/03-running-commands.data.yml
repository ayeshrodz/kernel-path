file-viewers:
  title: Which part of a file each command shows
  caption: Select a command to see which part of a long file it prints.
  height: 280
  mode: select
  initial: tail
  info:
    cat:
      tone: purple
      title: cat prints everything
      text: Every line, start to finish, with no pause. Ideal for short files such as /etc/hostname; unreadable for long ones.
    less:
      tone: blue
      title: less shows one screen at a time
      text: You move with Space, b and the arrow keys, search with /, and quit with q. Nothing scrolls past before you have read it.
    head:
      tone: teal
      title: head prints the beginning
      text: The first ten lines, or as many as -n asks for. Good for seeing what kind of content a file holds.
    tail:
      tone: amber
      title: tail prints the end
      text: The last ten lines, or -n N. Logs grow at the bottom, so this is where the newest entries are.
    wc:
      tone: coral
      title: wc counts instead of printing
      text: Lines, words and bytes for the whole file. -l counts only lines.
  elements:
    - kind: group
      x: 20
      y: 14
      w: 230
      h: 252
      tone: gray
      label: /var/log/messages
    - kind: node
      x: 38
      y: 48
      w: 194
      h: 46
      tone: blue
      title: first 10 lines
      active:
        - cat
        - less
        - head
        - wc
    - kind: node
      x: 38
      y: 104
      w: 194
      h: 94
      tone: gray
      title: thousands of lines
      sub: the middle of the file
      active:
        - cat
        - wc
    - kind: node
      x: 38
      y: 208
      w: 194
      h: 46
      tone: amber
      title: last 10 lines
      active:
        - cat
        - tail
        - wc
    - kind: node
      x: 340
      y: 18
      w: 300
      h: 42
      tone: purple
      title: cat /var/log/messages
      mono: true
      select: cat
      active:
        - cat
    - kind: node
      x: 340
      y: 70
      w: 300
      h: 42
      tone: blue
      title: less /var/log/messages
      mono: true
      select: less
      active:
        - less
    - kind: node
      x: 340
      y: 122
      w: 300
      h: 42
      tone: teal
      title: head /var/log/messages
