title: Logs and time
seoTitle: "journalctl, rsyslog, Log Rotation and chrony (RHCSA)"
seoDescription: "Read logs with journalctl, make the journal persistent, rotate logs, set time zones and NTP with chrony, and diagnose failing services."
goal: Read and filter the system logs, keep them across reboots and under control, keep the clock right, and use a calm method to diagnose problems.
objectives:
  - Explain journald and rsyslog and filter the journal by unit, priority, boot and time.
  - Make the journal persistent, add custom rsyslog files, and rotate logs with logrotate.
  - Read timedatectl and chrony output, set the time zone, and add NTP sources.
  - Diagnose a failing service from its status, its journal and the wider system logs.
objectiveIds:
  - ch11.reading
  - ch11.retention
  - ch11.time
  - ch11.diagnosis
