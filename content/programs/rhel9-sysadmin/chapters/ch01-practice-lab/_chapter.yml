title: Build Your Practice Lab
seoTitle: "Free RHCSA Practice Lab at Home: Rocky Linux 9 VMs on LXD"
seoDescription: "Build a free RHCSA practice lab at home: three Rocky Linux 9 virtual machines on LXD, a sealed network, snapshots and one-command resets."
setup: true
goal: Build a sealed practice lab at home, with Rocky Linux 9 VMs on LXD, so every exercise in this path has a safe place to run and a fast way to reset.
objectives:
  - Prepare an Ubuntu host with LXD and create a private lab network that nothing outside can connect into.
  - Build workstation, servera and serverb with a cloud-init profile that creates the lab users and installs the tools a RHEL server has.
  - Set up workstation as the machine you work from, with SSH keys to both servers and the lab command that starts and grades exercises.
  - Reset machines between exercises with snapshots and the rht-vmctl command.
objectiveIds:
  - ch01.lab-network
  - ch01.lab-machines
  - ch01.lab-tools
  - ch01.lab-reset
