title: Services and the boot process
seoTitle: "systemctl, systemd Services and the Boot Process (RHCSA)"
seoDescription: "Manage services with systemctl, write systemd unit files, change targets and recover a RHEL 9 system that will not boot. RHCSA chapter 9."
goal: Manage services with systemd, write your own units, understand the boot sequence and targets, and recover a system that will not boot normally.
objectives:
  - Start, stop, enable, disable and mask services, and separate "running now" from "starts at boot".
  - Write a service unit, override it with a drop-in, and diagnose a unit that will not start.
  - Describe the boot sequence, set the default target, read boot timing and change kernel arguments.
  - Recover from a lost root password or a bad /etc/fstab using console access.
objectiveIds:
  - ch09.services
  - ch09.units
  - ch09.boot
  - ch09.recovery
