streams:
  title: Where the three streams go
  caption: Select an operator to see where stdin, stdout and stderr are connected.
  height: 306
  mode: select
  initial: none
  info:
    none:
      tone: blue
      title: (no redirection)
      text: By default, stdin is the keyboard and both stdout and stderr go to the terminal, which is why they look alike.
    out:
      tone: blue
      title: '> file'
      text: stdout goes to the file, which is emptied first. Errors still appear on the screen.
    append:
      tone: blue
      title: '>> file'
      text: stdout is appended to the file, keeping what was already there. Errors still appear on the screen.
    err:
      tone: blue
      title: 2> file
      text: Only stderr goes to the file. Normal output still appears on the screen.
    both:
      tone: blue
      title: '&> file'
      text: Both streams go into one file. The older spelling is > file 2>&1.
    'null':
      tone: blue
      title: 2> /dev/null
      text: stderr is thrown away. Use it for errors you expect and understand.
    pipe:
      tone: blue
      title: '| wc -l'
      text: stdout feeds the next command's stdin. stderr does not travel through the pipe.
    in:
      tone: blue
      title: < file
      text: stdin comes from the file instead of the keyboard.
  elements:
  - kind: node
    x: 10
    y: 70
    w: 150
    h: 50
    tone: gray
    title: keyboard
    sub: 0  stdin
    overrides:
      title:
        none: keyboard
        out: keyboard
        append: keyboard
        err: keyboard
        both: keyboard
        'null': keyboard
        pipe: keyboard
        in: file
  - kind: arrow
    points:
    - - 160
      - 95
    - - 238
      - 95
  - kind: node
    x: 240
    y: 60
    w: 170
    h: 70
    tone: purple
    title: command
    mono: true
  - kind: arrow
    points:
    - - 410
      - 80
    - - 470
      - 40
    label: 1 stdout
    labelDy: -8
  - kind: node
    x: 472
    y: 16
    w: 200
    h: 50
    tone: teal
    title: terminal
    overrides:
      title:
        none: terminal
        out: file  (replaced)
        append: file  (added to the end)
        err: terminal
        both: file
        'null': terminal
        pipe: stdin of wc -l
        in: terminal
  - kind: arrow
    points:
    - - 410
      - 110
    - - 470
      - 150
    label: 2 stderr
    labelDy: 14
  - kind: node
    x: 472
    y: 126
    w: 200
    h: 50
    tone: red
    title: terminal
    overrides:
      title:
        none: terminal
        out: terminal
        append: terminal
        err: file
        both: the same file
        'null': /dev/null  (discarded)
        pipe: terminal
        in: terminal
      dashed:
        'null': true
  - kind: node
    x: 6
    y: 206
    w: 160
    h: 40
    tone: blue
    title: (no redirection)
    mono: true
    titleSize: 12.5
    select: none
