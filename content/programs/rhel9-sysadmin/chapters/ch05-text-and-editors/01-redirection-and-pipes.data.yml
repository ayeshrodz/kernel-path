practice:
  text:
    hint: Click here and try the redirections. Watch which lines still reach the screen.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. You can now route any command's output.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: redirection and pipes'
    prompt: '[student@servera ~]$'
    commands:
    - cmd: ls /etc/hostname /etc/nothere
      out: 'ls: cannot access ''/etc/nothere'': No such file or directory

        /etc/hostname'
    - cmd: ls /etc/hostname /etc/nothere > out.txt
      out: 'ls: cannot access ''/etc/nothere'': No such file or directory'
    - cmd: ls /etc/hostname /etc/nothere 2> err.txt
      out: /etc/hostname
    - cmd: ls /etc/hostname /etc/nothere 2> /dev/null
      out: /etc/hostname
    - cmd: ls /etc/hostname /etc/nothere &> both.txt
      out: ''
    - cmd: cat out.txt
      out: /etc/hostname
    - cmd: cat err.txt
      out: 'ls: cannot access ''/etc/nothere'': No such file or directory'
    - cmd: cat both.txt
      out: 'ls: cannot access ''/etc/nothere'': No such file or directory

        /etc/hostname'
    - cmd: ls /etc | wc -l
      out: '172'
    - cmd: ls -t /var/log | head -3
      out: 'messages

        secure

        lastlog'
    - cmd: find /etc -name "*.repo" 2> /dev/null
      out: '/etc/yum.repos.d/rocky-devel.repo

        /etc/yum.repos.d/rocky.repo

        /etc/yum.repos.d/rocky-addons.repo

        /etc/yum.repos.d/rocky-extras.repo

        /etc/yum.repos.d/rocky-security.repo'
    - cmd: wc -l < /etc/passwd
      out: '20'
    - cmd: cat < /etc/hostname
      out: servera.lab.example.com
    - cmd: ls /etc | tee etc-list.txt | wc -l
      out: '172'
    - cmd: head -n 2 etc-list.txt
      out: 'adjtime

        aliases'
    tasks:
    - text: Run ls /etc/hostname /etc/nothere and save only the normal output in out.txt.
      commands:
      - ls /etc/hostname /etc/nothere > out.txt
    - text: Run it again, saving only the error message in err.txt.
      commands:
      - ls /etc/hostname /etc/nothere 2> err.txt
    - text: Run it again with the error thrown away.
      commands:
      - ls /etc/hostname /etc/nothere 2> /dev/null
    - text: Count the entries in /etc with a pipe.
      commands:
      - ls /etc | wc -l
    - text: Find the .repo files under /etc without the permission errors.
      commands:
      - find /etc -name "*.repo" 2> /dev/null
    - text: Count /etc entries while saving the list to etc-list.txt.
      commands:
      - ls /etc | tee etc-list.txt | wc -l
quick:
  questions:
  - id: q-982e190ea189
    q: Which stream number is standard error?
    options:
    - '0'
    - '1'
    - '2'
    answer: 2
    explain: 0 is stdin, 1 stdout and 2 stderr. That is why 2> redirects errors.
  - id: q-d21b1bdebb57
    q: You want to add today's date to the end of history.log without losing what is there. Which do you use?
    options:
    - date > history.log
    - date >> history.log
    - date | history.log
    answer: 1
    explain: '>> appends. > would empty the file first, and | needs a command, not a file, on its right.'
  - id: q-1e479540f492
    q: Which command hides error messages but still shows normal output?
    options:
    - cmd > /dev/null
    - cmd 2> /dev/null
    - cmd &> /dev/null
    answer: 1
    explain: 2> redirects only stderr. > /dev/null would hide the output, and &> both.
  - id: q-d6322cb320de
    q: What does ls /etc | wc -l count?
    options:
    - The lines of ls's output, one per entry in /etc
    - The files in your home directory
    - The words in /etc
    answer: 0
    explain: The pipe feeds ls's output to wc, which counts its lines.
  - id: q-3acecd98a3a7
    q: You run sort names.txt > names.txt. What happens?
    options:
    - names.txt is sorted in place.
    - names.txt ends up empty.
    - sort refuses to run.
    answer: 1
    explain: The shell empties the file before sort starts, so sort reads nothing. Write to another file instead.
  - id: q-d0645ad29af5
    q: Why use tee in ls /etc | tee list.txt | wc -l?
    options:
    - To save the list to a file while it continues down the pipe
    - To make wc faster
    - To show errors
    answer: 0
    explain: tee writes its input to a file and also passes it on, like a T-junction.
