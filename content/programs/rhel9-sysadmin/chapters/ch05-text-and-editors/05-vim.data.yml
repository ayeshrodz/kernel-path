quick:
  questions:
  - id: q-75319bd1499e
    q: You opened a file in vim and typed some letters, but they did odd things instead of appearing. Why?
    options:
    - vim is in normal mode, where keys are commands; press i first.
    - The file is read-only.
    - vim needs a mouse to type.
    answer: 0
    explain: vim starts in normal mode. i switches to insert mode, where keys type text.
  - id: q-1e86292e8fb8
    q: You made a mess of a configuration file in vim and want to leave without saving anything. What do you type?
    options:
    - :wq
    - :q!
    - :w!
    answer: 1
    explain: :q! quits and throws away every change since the last save. :q alone refuses while there are unsaved changes.
  - id: q-406a8b9de974
    q: In normal mode, what does dd do?
    options:
    - Deletes (cuts) the current line
    - Duplicates the line
    - Deletes the whole file
    answer: 0
    explain: dd cuts the line, and p can put it back elsewhere. 3dd cuts three lines.
  - id: q-35b6a24bde65
    q: Which keys copy the current line and paste it below?
    options:
    - cc then v
    - yy then p
    - dd then u
    answer: 1
    explain: yy yanks (copies) the line and p puts it below the cursor.
  - id: q-db27b0ec0303
    q: Where do your personal vim settings go?
    options:
    - /etc/vimrc
    - ~/.vimrc
    - ~/.vim.conf
    answer: 1
    explain: ~/.vimrc is per user and overrides the system-wide /etc/vimrc.
  - id: q-9cdb741350ee
    q: How do you replace every occurrence of 8080 with 8443 in the file?
    options:
    - /8080/8443
    - :%s/8080/8443/g
    - :r 8080 8443
    answer: 1
    explain: '% means every line, s substitutes, and g means every match on each line, not just the first.'
