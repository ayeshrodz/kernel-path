modes:
  title: vim's modes
  caption: Select a mode to see what keys do there and how to get in and out.
  height: 300
  mode: select
  initial: normal
  info:
    normal:
      tone: purple
      title: Normal mode
      text: 'Where vim starts. Every key is a command: move, delete, copy, paste, undo. Press Esc from any other mode to come back here.'
    insert:
      tone: green
      title: Insert mode
      text: Keys type text into the file. Enter with i, a or o; leave with Esc. vim shows -- INSERT -- at the bottom.
    visual:
      tone: amber
      title: Visual mode
      text: 'Select text to act on: v for characters, V for whole lines, Ctrl+V for a column block. Then y copies, d cuts. Esc cancels.'
    command:
      tone: blue
      title: Command-line mode
      text: 'Type : for a command at the bottom of the screen: :w saves, :q quits, :wq does both, :q! quits without saving, :%s/a/b/g replaces. Enter runs it; Esc cancels.'
