export:
  title: Which variables a program inherits
  caption: 'Select a view: the child program starts with copies of the exported variables only.'
  height: 210
  mode: select
  initial: plain
  info:
    plain:
      tone: gray
      title: MSG=hello
      text: A plain assignment creates a shell variable. The shell can use it, but programs it starts never see it.
    export:
      tone: green
      title: export MSG
      text: Exporting marks the variable for the environment. Every program started afterwards gets its own copy. Changing the copy in the child never changes the parent.
  elements:
  - kind: group
    x: 10
    y: 10
    w: 300
    h: 150
    tone: purple
    label: your shell
  - kind: node
    x: 30
    y: 46
    w: 260
    h: 40
    tone: gray
    title: MSG=hello
    mono: true
    overrides:
      sub:
        plain: shell variable
        export: exported
    sub: shell variable
  - kind: node
    x: 30
    y: 100
    w: 260
    h: 40
    tone: green
    title: PATH, HOME, LANG …
    mono: true
    sub: exported
  - kind: arrow
    points:
    - - 310
      - 85
    - - 370
      - 85
    label: starts
    labelDy: -8
  - kind: group
    x: 372
    y: 10
    w: 300
    h: 150
    tone: teal
    label: bash -c   (a child program)
  - kind: node
    x: 392
    y: 46
    w: 260
    h: 40
