practice:
  text:
    hint: Click here and set a few variables. This terminal remembers nothing between commands, so it shows each command's result as it was on servera.
    inputLabel: Command to run in the practice terminal
    eventNotFound: 'bash: {value0}: event not found'
    notHere: This practice terminal only knows the examples in this lesson. Try anything else on servera.
    notFound: 'bash: {value0}: command not found'
    searchPrompt: '(reverse-i-search)`{value0}'':'
    noMatch: no match yet
    tasksTitle: Your tasks
    allDone: All done. Now make one of these permanent in ~/.bashrc on servera.
    doneLabel: done
    reset: Start again
  data: {}
  props:
    title: 'Practice terminal: variables and aliases'
    prompt: '[student@servera ~]$'
    commands:
    - cmd: COUNT=40
      out: ''
    - cmd: echo $COUNT
      out: '40'
    - cmd: echo COUNT
      out: COUNT
    - cmd: echo Repeat $COUNTx
      out: Repeat
    - cmd: echo Repeat ${COUNT}x
      out: Repeat 40x
    - cmd: echo $PATH
      out: /home/student/.local/bin:/home/student/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin
    - cmd: echo $HOME $USER $SHELL $LANG
      out: /home/student student /bin/bash en_US.utf8
    - cmd: MSG=hello
      out: ''
    - cmd: 'bash -c ''echo child sees: $MSG'''
      out: 'child sees:'
    - cmd: export MSG
      out: ''
    - cmd: alias lsl='ls -l --human-readable'
      out: ''
    - cmd: type lsl
      out: lsl is aliased to `ls -l --human-readable'
    - cmd: type ll
      out: ll is aliased to `ls -l'
    - cmd: LANG=C date
      out: Sat Oct  3 10:21:06 UTC 2026
    - cmd: date
      out: Sat Oct  3 10:21:06 AM UTC 2026
    - cmd: LC_TIME=en_GB.UTF-8 date
      out: Sat  3 Oct 10:21:06 UTC 2026
    tasks:
    - text: Set COUNT to 40 and print it.
      commands:
      - echo $COUNT
    - text: Print "Repeat 40x", with the x right after the value.
      commands:
      - echo Repeat ${COUNT}x
    - text: Show where the shell looks for commands.
      commands:
      - echo $PATH
    - text: Prove that a child shell can't see an unexported MSG.
      commands:
      - 'bash -c ''echo child sees: $MSG'''
    - text: Create the alias lsl for ls -l --human-readable and check it with type.
      commands:
      - type lsl
    - text: Run date once with the C locale, without changing your shell.
      commands:
      - LANG=C date
quick:
  questions:
  - id: q-2fb8309e497e
    q: Which line sets a variable correctly?
    options:
    - DIR = /srv/data
    - DIR=/srv/data
    - $DIR=/srv/data
    answer: 1
    explain: No spaces around =, and no $ when assigning. $ is only for reading the value.
  - id: q-ca31c9c68b55
    q: You set REPORT=weekly. Which prints weekly.txt?
    options:
    - echo $REPORT.txt
    - echo ${REPORT}.txt
    - Both
    answer: 2
    explain: A dot cannot be part of a variable name, so $REPORT.txt works too. Braces are needed when letters, digits or underscores follow, as in ${REPORT}_2026.
  - id: q-93a1773cd0dc
    q: A script you start can't see a variable you set in your shell. What is missing?
    options:
    - export
    - source
    - unset
    answer: 0
    explain: Programs inherit only exported (environment) variables.
  - id: q-934ff36d1533
    q: What happens if you run PATH=/opt/tools/bin?
    options:
    - /opt/tools/bin is added to the search path.
    - Only /opt/tools/bin is searched, so most commands stop being found.
    - Nothing until you log out.
    answer: 1
    explain: 'That replaces PATH. To add a directory, include the old value: PATH=$PATH:/opt/tools/bin.'
  - id: q-51aea1eaeb29
    q: Where do you put an alias so it exists in every new shell you open?
    options:
    - ~/.bashrc
    - /etc/hosts
    - ~/.ssh/config
    answer: 0
    explain: ~/.bashrc runs for every interactive shell, and RHEL's ~/.bash_profile runs it for login shells too.
  - id: q-dee4d92b7de4
    q: You edited ~/.bashrc. How do you apply it to the shell you are using now?
    options:
    - Run bash ~/.bashrc
    - Run source ~/.bashrc
    - Nothing; it applies immediately
    answer: 1
    explain: source runs the file in the current shell. bash ~/.bashrc would run it in a child shell that exits straight away.
