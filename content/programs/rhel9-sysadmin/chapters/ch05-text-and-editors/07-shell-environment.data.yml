startup:
  title: Which startup files Bash reads
  caption: Select how the shell started. SSH logins and console logins are login shells; a shell started inside another is not.
  height: 240
  mode: select
  initial: login
  info:
    login:
      tone: purple
      title: A login shell
      text: SSH, the console and su - start login shells. Bash reads /etc/profile (which runs /etc/profile.d/*.sh), then ~/.bash_profile, which on RHEL runs ~/.bashrc, which runs /etc/bashrc.
    nonlogin:
      tone: teal
      title: A non-login interactive shell
      text: Typing bash, or opening a new terminal tab in a desktop, starts a shell that skips the profile files and reads only ~/.bashrc, which runs /etc/bashrc.
  elements:
  - kind: node
    x: 6
    y: 40
    w: 124
    h: 54
    tone: purple
    title: /etc/profile
    sub: all users
    mono: true
    titleSize: 11.5
    active: &id001
    - login
    visible: *id001
  - kind: arrow
    points:
    - - 130
      - 67
    - - 142
      - 67
    visible:
    - login
  - kind: node
    x: 142
    y: 40
    w: 124
    h: 54
    tone: purple
    title: /etc/profile.d/
    sub: '*.sh · all users'
    mono: true
    titleSize: 11.5
    active: &id002
    - login
    visible: *id002
  - kind: arrow
    points:
    - - 266
      - 67
    - - 278
      - 67
    visible:
    - login
  - kind: node
    x: 278
    y: 40
    w: 124
    h: 54
    tone: green
    title: ~/.bash_profile
    sub: you
    mono: true
    titleSize: 11.5
    active: &id003
    - login
    visible: *id003
  - kind: arrow
    points:
    - - 402
      - 67
    - - 414
      - 67
    visible: &id004
    - login
    - nonlogin
  - kind: node
    x: 414
    y: 40
    w: 124
    h: 54
