title: Build Your Practice Lab
seoTitle: "Free RHCE Practice Lab at Home for Ansible"
seoDescription: "Build a free RHCE practice lab at home: a control node and four managed Rocky Linux 9 hosts on LXD, sealed and resettable with snapshots."
setup: true
goal: Build a sealed, classroom-style practice lab at home, with Rocky Linux 9 VMs on LXD using the classroom's names, addresses and users, so you can try every exercise in this guide.
objectives:
  - Prepare an Ubuntu host with LXD and create a private lab network that nothing outside can connect into.
  - Build workstation and servera to serverd with a cloud-init profile that creates the classroom users.
  - Set up workstation as an Ansible control node with ansible-core 2.14 and ansible-navigator.
  - Reset machines between exercises with snapshots and a classroom-compatible rht-vmctl command.
objectiveIds:
  - ch01.lab-network
  - ch01.lab-machines
  - ch01.lab-tools
  - ch01.lab-reset
