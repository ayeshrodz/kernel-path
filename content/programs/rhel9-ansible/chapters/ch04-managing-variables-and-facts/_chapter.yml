title: Managing Variables and Facts
seoTitle: "Ansible Variables, Facts and Ansible Vault (RHCE)"
seoDescription: "Use variables and precedence, protect secrets with Ansible Vault, and gather facts, custom facts and magic variables."
goal: Write playbooks that use variables to simplify management, protect secrets with Ansible Vault, and use facts to reference information about managed hosts.
objectives:
  - Create and reference variables that affect particular hosts or host groups, the play, or the global environment, and describe how variable precedence works.
  - Encrypt sensitive variables with Ansible Vault, and run playbooks that reference Vault-encrypted variable files.
  - Reference data about managed hosts using Ansible facts, and configure custom facts on managed hosts.
objectiveIds:
  - ch04.variables
  - ch04.vault
  - ch04.facts
