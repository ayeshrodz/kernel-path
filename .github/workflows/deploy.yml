name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Optional. With both set, the content is signed during the build and the site refuses content
          # that is not signed by this key. See docs/HOSTING.md.
          KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
          KERNEL_PUBLIC_KEY: ${{ vars.KERNEL_PUBLIC_KEY }}

      - name: Keep the published sitemap (to tell search engines what changed)
        run: curl -fsSL https://kernelpath.dev/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml" || true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Tell search engines about new and changed pages (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs "$RUNNER_TEMP/previous-sitemap.xml" dist/sitemap.xml
