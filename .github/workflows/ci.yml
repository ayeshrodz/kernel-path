name: CI

# Runs on every pull request (including from forks). It only builds and checks
# formatting, content, lab contracts and browser behavior.
on:
  pull_request:


permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check formatting
        run: npm run format:check
      - run: npm run validate:content
      - run: npm test
      - run: npm run test:labs
      - name: Build the site
        run: npm run build
      - name: Compile the content bundle
        run: npm run content:build
      - run: python -m pip install -r tests/browser-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
